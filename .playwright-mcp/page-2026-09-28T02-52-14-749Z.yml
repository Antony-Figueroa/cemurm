              - paragraph [ref=f54e282]:
                - strong [ref=f54e283]: Convey information with more than color alone.
                - text: Some people have trouble differentiating between certain colors and shades. For example, people who are color blind may have particular difficulty with pairings such as red-green and blue-orange. Offer visual indicators, like distinct shapes or icons, in addition to color to help people perceive differences in function and changes in state. Consider allowing people to customize color schemes such as chart colors or game characters so they can personalize your interface in a way that’s comfortable for them.
              - generic [ref=f54e284]:
                - generic [ref=f54e285]:
                  - paragraph [ref=f54e286]:
                    - figure "For someone with red-green color blindness, these indicators might appear the same." [ref=f54e287]:
                      - generic:
                        - img "An illustration of a green circle to the left of a red circle."
                  - paragraph:
                    - generic:
                      - img "An X in a circle to indicate incorrect usage."
                - generic [ref=f54e289]:
                  - paragraph [ref=f54e290]:
                    - figure "Both visual indicators and color help differentiate between indicators." [ref=f54e291]:
                      - generic:
                        - img "An illustration of a green circle containing a checkmark to the left of a red octagon containing an X."
                  - paragraph:
                    - generic:
                      - img "A checkmark in a circle to indicate correct usage."
              - paragraph [ref=f54e293]:
                - strong [ref=f54e294]: Describe your app’s interface and content for VoiceOver.
                - text: VoiceOver is a screen reader that lets people experience your app’s interface without needing to see the screen. For more guidance, see
                - link "VoiceOver" [ref=f54e295] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/voiceover
                - text: .
              - heading [level=2] [ref=f54e296]:
                - link "Hearing in page link" [ref=f54e297] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility#Hearing
              - paragraph:
                - generic:
                  - img "An illustration containing five symbols associated with the topic of hearing, including symbols representing sound, waveforms, and closed captioning."
              - paragraph [ref=f54e298]: The people who use your interface may be deaf or hard of hearing. They may also be in noisy or public environments.
              - paragraph [ref=f54e299]:
                - strong [ref=f54e300]: Support text-based ways to enjoy audio and video.
                - text: "It’s important that dialogue and crucial information about your app or game isn’t communicated through audio alone. Depending on the context, give people different text-based ways to experience their media, and allow people to customize the visual presentation of that text:"
              - list [ref=f54e301]:
                - listitem [ref=f54e302]:
                  - paragraph [ref=f54e303]:
                    - strong [ref=f54e304]: Captions
                    - text: give people the textual equivalent of audible information in video or audio-only content. Captions are great for scenarios like game cutscenes and video clips where text synchronizes live with the media.
                - listitem [ref=f54e305]:
                  - paragraph [ref=f54e306]:
                    - strong [ref=f54e307]: Subtitles
                    - text: allow people to read live onscreen dialogue in their preferred language. Subtitles are great for TV shows and movies.
                - listitem [ref=f54e308]:
                  - paragraph [ref=f54e309]:
                    - strong [ref=f54e310]: Audio descriptions
                    - text: are interspersed between natural pauses in the main audio of a video and supply spoken narration of important information that’s presented only visually.
                - listitem [ref=f54e311]:
                  - paragraph [ref=f54e312]:
                    - strong [ref=f54e313]: Transcripts
                    - text: provide a complete textual description of a video, covering both audible and visual information. Transcripts are great for longer-form media like podcasts and audiobooks where people may want to review content as a whole or highlight the transcript as media is playing.
              - paragraph [ref=f54e314]:
                - text: For developer guidance, see
                - link "Selecting subtitles and alternative audio tracks" [ref=f54e315] [cursor=pointer]:
                  - /url: /documentation/avfoundation/selecting-subtitles-and-alternative-audio-tracks
                - text: .
              - paragraph [ref=f54e316]:
                - strong [ref=f54e317]: Use haptics in addition to audio cues.
                - text: If your interface conveys information through audio cues — such as a success chime, error sound, or game feedback — consider pairing that sound with matching haptics for people who can’t perceive the audio or have their audio turned off. In iOS and iPadOS, you can also use
                - link "Music Haptics" [ref=f54e318] [cursor=pointer]:
                  - /url: /documentation/mediaaccessibility/music-haptics
                - text: and
                - link "Audio graphs" [ref=f54e319] [cursor=pointer]:
                  - /url: /documentation/accessibility/audio-graphs
                - text: to let people experience music and infographics through vibration and texture. For guidance, see
                - link "Playing haptics" [ref=f54e320] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/playing-haptics
                - text: .
              - paragraph:
                - generic:
                  - img "An illustration of an iPhone device vibrating as music plays from the device."
              - paragraph [ref=f54e321]:
                - strong [ref=f54e322]: Augment audio cues with visual cues.
                - text: This is especially important for games and spatial apps where important content might be taking place off screen. When using audio to guide people towards a specific action, also add in visual indicators that point to where you want people to interact.
              - heading [level=2] [ref=f54e323]:
                - link "Mobility in page link" [ref=f54e324] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility#Mobility
              - paragraph:
                - generic:
                  - img "An illustration containing five symbols associated with the topic of mobility, including symbols representing the keyboard, movement, and touch."
              - paragraph [ref=f54e325]: Ensure your interface offers a comfortable experience for people with limited dexterity or mobility.
              - paragraph [ref=f54e326]:
                - strong [ref=f54e327]: Offer sufficiently sized controls.
                - text: Controls that are too small are hard for many people to interact with and select. Strive to meet the recommended minimum control size for each platform to ensure controls and menus are comfortable for all when tapping and clicking.
              - table [ref=f54e329]:
                - rowgroup [ref=f54e330]:
                  - row [ref=f54e331]:
                    - columnheader [ref=f54e332]:
                      - paragraph [ref=f54e333]: Platform
                    - columnheader [ref=f54e334]:
                      - paragraph [ref=f54e335]: Default control size
                    - columnheader [ref=f54e336]:
                      - paragraph [ref=f54e337]: Minimum control size
                - rowgroup [ref=f54e338]:
