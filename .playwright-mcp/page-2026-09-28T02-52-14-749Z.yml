              - paragraph [ref=f54e374]:
                - strong [ref=f54e375]: Consider spacing between controls as important as size.
                - text: Include enough padding between elements to reduce the chance that someone taps the wrong control. In general, it works well to add about 12 points of padding around elements that include a bezel. For elements without a bezel, about 24 points of padding works well around the element’s visible edges.
              - generic [ref=f54e376]:
                - generic [ref=f54e377]:
                  - paragraph [ref=f54e378]:
                    - figure "Elements with insufficient padding" [ref=f54e379]:
                      - generic:
                        - 'img "An illustration showing three buttons: rewind, play, and fast forward. The buttons have insufficient padding between them."'
                  - paragraph:
                    - generic:
                      - img "An X in a circle to indicate incorrect usage."
                - generic [ref=f54e381]:
                  - paragraph [ref=f54e382]:
                    - figure "Elements with sufficient padding" [ref=f54e383]:
                      - generic:
                        - 'img "An illustration showing three buttons: rewind, play, and fast forward. The buttons are spaced apart, with sufficient padding between them."'
                  - paragraph:
                    - generic:
                      - img "A checkmark in a circle to indicate correct usage."
              - paragraph [ref=f54e385]:
                - strong [ref=f54e386]: Support simple gestures for common interactions.
                - text: For many people, with or without disabilities, complex gestures can be challenging. For interactions people do frequently in your app or game, use the simplest gesture possible — avoid custom multifinger and multihand gestures — so repetitive actions are both comfortable and easy to remember.
              - paragraph [ref=f54e387]:
                - strong [ref=f54e388]: Offer alternatives to gestures.
                - text: Make sure your UI’s core functionality is accessible through more than one type of physical interaction. Gestures can be less comfortable for people who have limited dexterity, so offer onscreen ways to achieve the same outcome. For example, if you use a swipe gesture to dismiss a view, also make a button available so people can tap or use an assistive device.
              - generic [ref=f54e389]:
                - paragraph [ref=f54e391]:
                  - figure "Edit and tap to delete" [ref=f54e392]:
                    - generic:
                      - img "An illustration of a table view in edit mode. The rows of the table include delete buttons."
                - paragraph [ref=f54e395]:
                  - figure "Swipe to delete" [ref=f54e396]:
                    - generic:
                      - img "An illustration of a table view. One of the rows in the table is swiped to the left to reveal a delete button."
              - paragraph [ref=f54e398]:
                - strong [ref=f54e399]: Let people use Voice Control to give guidance and enter information verbally.
                - text: With Voice Control, people can interact with their devices entirely by speaking commands. They can perform gestures, interact with screen elements, dictate and edit text, and more. To ensure a smooth experience, label interface elements appropriately. For developer guidance, see
                - link "Voice Control" [ref=f54e400] [cursor=pointer]:
                  - /url: /documentation/accessibility/voice-control
                - text: .
              - paragraph [ref=f54e401]:
                - strong [ref=f54e402]: Integrate with Siri and Shortcuts to let people perform tasks using voice alone.
                - text: When your app supports Siri and Shortcuts, people can automate the important and repetitive tasks they perform regularly. They can initiate these tasks from Siri, the Action button on their iPhone or Apple Watch, and shortcuts on their Home Screen or in Control Center. For guidance, see
                - link "Siri" [ref=f54e403] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/siri
                - text: .
              - paragraph [ref=f54e404]:
                - strong [ref=f54e405]: Support mobility-related assistive technologies.
                - text: Features like
                - link "VoiceOver" [ref=f54e406] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/voiceover
                - text: ", AssistiveTouch, Full Keyboard Access, Pointer Control, and"
                - link "Switch Control" [ref=f54e407] [cursor=pointer]:
                  - /url: /documentation/accessibility/switch-control
                - text: offer alternative ways for people with low mobility to interact with their devices. Conduct testing and verify that your app or game supports these technologies, and that your interface elements are appropriately labeled to ensure a great experience. For more information, see
                - link "Performing accessibility testing for your app" [ref=f54e408] [cursor=pointer]:
                  - /url: /documentation/accessibility/performing-accessibility-testing-for-your-app
                - text: .
              - heading [level=2] [ref=f54e409]:
                - link "Speech in page link" [ref=f54e410] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility#Speech
              - paragraph:
                - generic:
                  - img "An illustration containing five symbols associated with the topic of speech, including symbols representing waveforms and speech."
              - paragraph [ref=f54e411]: Apple’s accessibility features help people with speech disabilities and people who prefer text-based interactions to communicate effectively using their devices.
              - paragraph [ref=f54e412]:
                - strong [ref=f54e413]: Let people use the keyboard alone to navigate and interact with your app.
                - text: People can turn on Full Keyboard Access to navigate apps using their physical keyboard. The system also defines accessibility keyboard shortcuts and a wide range of other
                - link "keyboard shortcuts" [ref=f54e414] [cursor=pointer]:
                  - /url: https://support.apple.com/en-us/102650
                - text: that many people use all the time. Avoid overriding system-defined keyboard shortcuts and evaluate your app to ensure it works well with Full Keyboard Access. For additional guidance, see
                - link "Keyboards" [ref=f54e415] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/keyboards
                - text: . For developer guidance, see
                - link "Support Full Keyboard Access in your iOS app" [ref=f54e416] [cursor=pointer]:
                  - /url: https://developer.apple.com/videos/play/wwdc2021/10120
                - text: .
              - paragraph [ref=f54e417]:
                - strong [ref=f54e418]: Support Switch Control.
                - text: Switch Control is an assistive technology that lets people control their devices through separate hardware, game controllers, or sounds such as a click or a pop. People can perform actions like selecting, tapping, typing, and drawing when your app or game supports the ability to navigate using Switch Control. For developer guidance, see
                - link "Switch Control" [ref=f54e419] [cursor=pointer]:
                  - /url: /documentation/accessibility/switch-control
                - text: .
              - heading [level=2] [ref=f54e420]:
                - link "Cognitive in page link" [ref=f54e421] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility#Cognitive
              - paragraph:
                - generic:
                  - img "An illustration containing five symbols associated with the topic of cognition, including symbols representing music, security, and information hierarchy."
              - paragraph [ref=f54e422]: When you minimize complexity in your app or game, all people benefit.
              - paragraph [ref=f54e423]:
                - strong [ref=f54e424]: Keep actions simple and intuitive.
                - text: Ensure that people can navigate your interface using easy-to-remember and consistent interactions. Prefer system gestures and behaviors people are already familiar with over creating custom gestures people must learn and retain.
              - paragraph [ref=f54e425]:
                - strong [ref=f54e426]: Minimize use of time-boxed interface elements.
                - text: Views and controls that auto-dismiss on a timer can be problematic for people who need longer to process information, and for people who use assistive technologies that require more time to traverse the interface. Prefer dismissing views with an explicit action.
              - paragraph [ref=f54e427]:
                - strong [ref=f54e428]: Consider offering difficulty accommodations in games.
                - text: Everyone has their own way of playing and enjoying games. To support a variety of cognitive abilities, consider adding the ability to customize the difficulty level of your game, such as offering options for people to reduce the criteria for successfully completing a level, adjust reaction time, or enable control assistance.
              - paragraph [ref=f54e429]:
                - strong [ref=f54e430]: Let people control audio and video playback.
                - text: Avoid autoplaying audio and video content without also providing controls to start and stop it. Make sure these controls are discoverable and easy to act upon, and consider global settings that let people opt out of auto-playing all audio and video. For developer guidance, see
                - link "Animated images" [ref=f54e431] [cursor=pointer]:
                  - /url: /documentation/accessibility/animated-images
                - text: and
                - link [ref=f54e432] [cursor=pointer]:
                  - /url: /documentation/uikit/uiaccessibility/isvideoautoplayenabled
                  - code [ref=f54e433]: isVideoAutoplayEnabled
                - text: .
              - paragraph [ref=f54e434]:
                - strong [ref=f54e435]: Allow people to opt out of flashing lights in video playback.
                - text: People might want to avoid bright, frequent flashes of light in the media they consume. A Dim Flashing Lights setting allows the system to calculate, mitigate, and inform people about flashing lights in a piece of media. If your app supports video playback, ensure that it responds appropriately to the Dim Flashing Lights setting. For developer guidance, see
                - link "Flashing lights" [ref=f54e436] [cursor=pointer]:
                  - /url: /documentation/mediaaccessibility/flashing-lights
                - text: .
              - paragraph [ref=f54e437]:
                - strong [ref=f54e438]: Be cautious with fast-moving and blinking animations.
                - text: "When you use these effects in excess, it can be distracting, cause dizziness, and in some cases even result in epileptic episodes. People who are prone to these effects can turn on the Reduce Motion accessibility setting. When this setting is active, ensure your app or game responds by reducing automatic and repetitive animations, including zooming, scaling, and peripheral motion. Other best practices for reducing motion include:"
              - list [ref=f54e439]:
                - listitem [ref=f54e440]:
                  - paragraph [ref=f54e441]: Tightening animation springs to reduce bounce effects
                - listitem [ref=f54e442]:
                  - paragraph [ref=f54e443]: Tracking animations directly with people’s gestures
                - listitem [ref=f54e444]:
                  - paragraph [ref=f54e445]: Avoiding animating depth changes in z-axis layers
                - listitem [ref=f54e446]:
                  - paragraph [ref=f54e447]: Replacing transitions in x-, y-, and z-axes with fades to avoid motion
                - listitem [ref=f54e448]:
                  - paragraph [ref=f54e449]: Avoiding animating into and out of blurs
              - paragraph [ref=f54e450]:
                - strong [ref=f54e451]: Optimize your app’s UI for Assistive Access.
                - text: Assistive Access is an accessibility feature in iOS and iPadOS that allows people with cognitive disabilities to use a streamlined version of your app. Assistive Access sets a default layout and control presentation for apps that reduces cognitive load, such as the following layout of the Camera app.
              - generic [ref=f54e452]:
                - paragraph [ref=f54e454]:
                  - 'img "A screenshot of the Camera app in Assistive Access, showing an interface with three large buttons: Photo, Video, and Back." [ref=f54e458]'
                - paragraph [ref=f54e460]:
                  - 'img "A screenshot of the Camera app open to the photo screen in Assistive Access, showing an interface with two large buttons: Take Photo and Back." [ref=f54e464]'
              - paragraph [ref=f54e465]: "To optimize your app for this mode, use the following guidelines when Assistive Access is turned on:"
              - list [ref=f54e466]:
                - listitem [ref=f54e467]:
                  - paragraph [ref=f54e468]: Identify the core functionality of your app and consider removing noncritical workflows and UI elements.
                - listitem [ref=f54e469]:
                  - paragraph [ref=f54e470]: Break up multistep workflows so people can focus on a single interaction per screen.
                - listitem [ref=f54e471]:
                  - paragraph [ref=f54e472]: Always ask for confirmation twice whenever people perform an action that’s difficult to recover from, such a deleting a file.
              - paragraph [ref=f54e473]:
                - text: For developer guidance, see
                - link "Assistive Access" [ref=f54e474] [cursor=pointer]:
                  - /url: /documentation/accessibility/assistive-access
                - text: .
              - heading [level=2] [ref=f54e475]:
                - link "Platform considerations in page link" [ref=f54e476] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility#Platform-considerations
              - paragraph [ref=f54e477]:
                - emphasis [ref=f54e478]: No additional considerations for iOS, iPadOS, macOS, tvOS, or watchOS.
              - heading [level=3] [ref=f54e479]:
                - link "visionOS in page link" [ref=f54e480] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility#visionOS
              - paragraph [ref=f54e481]: visionOS offers a variety of accessibility features people can use to interact with their surroundings in ways that are comfortable and work best for them, including head and hand Pointer Control, and a Zoom feature.
              - generic [ref=f54e482]:
                - navigation [ref=f54e483]:
                  - list [ref=f54e484]:
                    - listitem [ref=f54e485]:
                      - link "Pointer Control (hand)" [ref=f54e486]:
                        - /url: "#"
                    - listitem [ref=f54e487]:
                      - link "Pointer Control (head)" [ref=f54e488] [cursor=pointer]:
                        - /url: "#"
                    - listitem [ref=f54e489]:
                      - link "Zoom" [ref=f54e490] [cursor=pointer]:
                        - /url: "#"
                - 'group "Video with custom controls. Content description: A recording of a person''s hand using Pointer Control to interact with content in an app''s visionOS window. A line with a pointer at the end extends from the person''s hand. It changes position within the field of view as the person moves their hand." [ref=f54e496]':
                  - link "Play" [ref=f54e499] [cursor=pointer]:
                    - /url: "#"
              - paragraph [ref=f54e504]:
                - strong [ref=f54e505]: Prioritize comfort.
                - text: "The immersive nature of visionOS means that interfaces, animations, and interactions have a greater chance of causing motion sickness, and visual and ergonomic discomfort for people. To ensure the most comfortable experience, consider these tips:"
              - list [ref=f54e506]:
                - listitem [ref=f54e507]:
                  - paragraph [ref=f54e508]: Keep interface elements within a person’s field of view. Prefer horizontal layouts to vertical ones that might cause neck strain, and avoid demanding the viewer’s attention in different locations in quick succession.
                - listitem [ref=f54e509]:
                  - paragraph [ref=f54e510]: Reduce the speed and intensity of animated objects, particularly in someone’s peripheral vision.
                - listitem [ref=f54e511]:
                  - paragraph [ref=f54e512]: Be gentle with camera and video motion, and avoid situations where someone may feel like the world around them is moving without their control.
                - listitem [ref=f54e513]:
                  - paragraph [ref=f54e514]: Avoid anchoring content to the wearer’s head, which may make them feel stuck and confined, and also prevent them from using assistive technologies like Pointer Control.
                - listitem [ref=f54e515]:
                  - paragraph [ref=f54e516]: Minimize the need for large and repetitive gestures, as these can become tiresome and may be difficult depending on a person’s surroundings.
              - paragraph [ref=f54e517]:
                - text: For additional guidance, see
                - link "Create accessible spatial experiences" [ref=f54e518] [cursor=pointer]:
                  - /url: https://developer.apple.com/videos/play/wwdc2023/10034
                - text: and
                - link "Design considerations for vision and motion" [ref=f54e519] [cursor=pointer]:
                  - /url: https://developer.apple.com/videos/play/wwdc2023/10078
                - text: .
