              - paragraph [ref=f54e257]:
                - text: If your app doesn’t provide this minimum contrast by default, ensure it at least provides a higher contrast color scheme when the system setting Increase Contrast is turned on. If your app supports
                - link "Dark Mode" [ref=f54e258] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode
                - text: ", make sure to check the minimum contrast in both light and dark appearances."
              - generic [ref=f54e259]:
                - generic [ref=f54e260]:
                  - paragraph [ref=f54e261]:
                    - figure "A button with insufficient color contrast" [ref=f54e262]:
                      - generic:
                        - img "An illustration of a button that has insufficient contrast between the button's title and background."
                  - paragraph:
