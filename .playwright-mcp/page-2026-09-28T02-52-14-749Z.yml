            - generic [ref=f54e126]:
              - heading "Accessibility" [level=1] [ref=f54e128]
              - generic [ref=f54e129]: Accessible user interfaces empower everyone to have a great experience with your app or game.
            - generic [ref=f54e134]:
              - paragraph [ref=f54e135]:
                - img "A sketch of the Accessibility icon. The image is overlaid with rectangular and circular grid lines and is tinted yellow to subtly reflect the yellow in the original six-color Apple logo." [ref=f54e137]
              - paragraph [ref=f54e138]: "When you design for accessibility, you reach a larger audience and create a more inclusive experience. An accessible interface allows people to experience your app or game regardless of their capabilities or how they use their devices. Accessibility makes information and interactions available to everyone. An accessible interface is:"
              - list [ref=f54e139]:
                - listitem [ref=f54e140]:
                  - paragraph [ref=f54e141]:
                    - strong [ref=f54e142]: Intuitive.
                    - text: Your interface uses familiar and consistent interactions that make tasks straightforward to perform.
                - listitem [ref=f54e143]:
                  - paragraph [ref=f54e144]:
                    - strong [ref=f54e145]: Perceivable.
                    - text: Your interface doesn’t rely on any single method to convey information. People can access and interact with your content, whether they use sight, hearing, speech, or touch.
                - listitem [ref=f54e146]:
                  - paragraph [ref=f54e147]:
                    - strong [ref=f54e148]: Adaptable.
                    - text: Your interface adapts to how people want to use their device, whether by supporting system accessibility features or letting people personalize settings.
              - paragraph [ref=f54e149]:
                - text: As you design your app, audit the accessibility of your interface. Use
                - link "Accessibility Inspector" [ref=f54e150] [cursor=pointer]:
                  - /url: /documentation/accessibility/accessibility-inspector
                - text: to highlight accessibility issues with your interface and to understand how your app represents itself to people using system accessibility features. You can also communicate how accessible your app is on the App Store using Accessibility Nutrition Labels. To learn more about how to evaluate and indicate accessibility feature support, see
                - link "Accessibility Nutrition Labels" [ref=f54e151] [cursor=pointer]:
                  - /url: https://developer.apple.com/help/app-store-connect/manage-app-accessibility/overview-of-accessibility-nutrition-labels
                - text: in App Store Connect help.
              - heading [level=2] [ref=f54e152]:
                - link "Vision in page link" [ref=f54e153] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility#Vision
              - paragraph [ref=f54e154]:
                - img "An illustration containing five symbols associated with the topic of vision, including symbols representing text size, magnification, VoiceOver, and spoken dialogue." [ref=f54e156]
              - paragraph [ref=f54e157]: The people who use your interface may be blind, color blind, or have low vision or light sensitivity. They may also be in situations where lighting conditions and screen brightness affect their ability to interact with your interface.
              - paragraph [ref=f54e158]:
                - strong [ref=f54e159]: Support larger text sizes.
                - text: Make sure people can adjust the size of your text or icons to make them more legible, visible, and comfortable to read. Ideally, give people the option to enlarge text by at least 200 percent (or 140 percent in watchOS apps). Your interface can support font size enlargement either through custom UI, or by adopting Dynamic Type. Dynamic Type is a systemwide setting that lets people adjust the size of text for comfort and legibility. For more guidance, see
                - link "Supporting Dynamic Type" [ref=f54e160] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/typography#Supporting-Dynamic-Type
                - text: .
              - paragraph [ref=f54e161]:
                - strong [ref=f54e162]: Use recommended defaults for custom type sizes.
                - text: Each platform has different default and minimum sizes for system-defined type styles to promote readability. If you’re using custom type styles, follow the recommended defaults.
              - table [ref=f54e164]:
                - rowgroup [ref=f54e165]:
