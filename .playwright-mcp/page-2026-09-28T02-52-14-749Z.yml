              - paragraph [ref=f54e268]:
                - strong [ref=f54e269]: Prefer system-defined colors.
                - text: These colors have their own accessible variants that automatically adapt when people adjust their color preferences, such as enabling Increase Contrast or toggling between the light and dark appearances. For guidance, see
                - link "Color" [ref=f54e270] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color
                - text: .
              - generic [ref=f54e271]:
                - paragraph [ref=f54e273]:
                  - figure [ref=f54e274]:
                    - generic:
                      - img "An illustration demonstrating how the system-defined color red appears above a light and dark background. In the illustration, a circle is positioned above a rounded rectangle. The left side of the rounded rectangle is light in color, and the right side is dark. The left side of the circle is slightly darker than the right side."
