              - paragraph [ref=f54e209]:
                - strong [ref=f54e210]: Bear in mind that font weight can also impact how easy text is to read.
                - text: If you’re using a custom font with a thin weight, aim for larger than the recommended sizes to increase legibility. For more guidance, see
                - link "Typography" [ref=f54e211] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/typography
                - text: .
              - generic [ref=f54e212]:
                - paragraph [ref=f54e214]:
                  - figure "Thicker weights are easier to read for smaller font sizes." [ref=f54e215]:
                    - generic:
                      - img "An illustration of a rectangular view containing the word 'Hello,' formatted bold, at a small font size."
                - paragraph [ref=f54e218]:
                  - figure "Consider increasing the font size when using a thin weight." [ref=f54e219]:
                    - generic:
                      - img "An illustration of a rectangular view containing the word 'Hello,' formatted thin, at a large font size."
              - paragraph [ref=f54e221]:
                - strong [ref=f54e222]: Strive to meet color contrast minimum standards.
                - text: To ensure all information in your app is legible, it’s important that there’s enough contrast between foreground text and icons and background colors. Two popular standards of measure for color contrast are the
                - link "Web Content Accessibility Guidelines (WCAG)" [ref=f54e223] [cursor=pointer]:
                  - /url: https://www.w3.org/TR/WCAG/
                - text: and the Accessible Perceptual Contrast Algorithm (APCA). Use standard contrast calculators to ensure your UI meets acceptable levels.
                - link "Accessibility Inspector" [ref=f54e224] [cursor=pointer]:
                  - /url: /documentation/accessibility/accessibility-inspector
                - text: uses the following values from WCAG Level AA as guidance in determining whether your app’s colors have an acceptable contrast.
              - table [ref=f54e226]:
                - rowgroup [ref=f54e227]:
                  - row [ref=f54e228]:
                    - columnheader [ref=f54e229]:
                      - paragraph [ref=f54e230]: Text size
                    - columnheader [ref=f54e231]:
                      - paragraph [ref=f54e232]: Text weight
                    - columnheader [ref=f54e233]:
                      - paragraph [ref=f54e234]: Minimum contrast ratio
                - rowgroup [ref=f54e235]:
                  - row [ref=f54e236]:
                    - cell [ref=f54e237]:
                      - paragraph [ref=f54e238]: Up to 17 pts
                    - cell [ref=f54e239]:
                      - paragraph [ref=f54e240]: All
                    - cell [ref=f54e241]:
                      - paragraph [ref=f54e242]: 4.5:1
                  - row [ref=f54e243]:
