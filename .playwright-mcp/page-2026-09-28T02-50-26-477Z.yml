        - generic [ref=f36e122]:
          - main [ref=f36e123]:
            - generic [ref=f36e126]:
              - heading "Color" [level=1] [ref=f36e128]
              - generic [ref=f36e129]: Judicious use of color can enhance communication, evoke your brand, provide visual continuity, communicate status and feedback, and help people understand information.
            - generic [ref=f36e134]:
              - paragraph:
                - generic:
                  - img "A sketch of a paint palette, suggesting the use of color. The image is overlaid with rectangular and circular grid lines and is tinted yellow to subtly reflect the yellow in the original six-color Apple logo."
              - paragraph [ref=f36e135]: The system defines colors that look good on various backgrounds and appearance modes, and can automatically adapt to vibrancy and accessibility settings. Using system colors is a convenient way to make your experience feel at home on the device.
              - paragraph [ref=f36e136]: You may also want to use custom colors to enhance the visual experience of your app or game and express its unique personality. The following guidelines can help you use color in ways that people appreciate, regardless of whether you use system-defined or custom colors.
              - heading [level=2] [ref=f36e137]:
                - link "Best practices in page link" [ref=f36e138] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Best-practices
              - paragraph [ref=f36e139]:
                - strong [ref=f36e140]: Avoid using the same color to mean different things.
                - text: Use color consistently throughout your interface, especially when you use it to help communicate information like status or interactivity. For example, if you use your brand color to indicate that a borderless button is interactive, using the same or similar color to stylize noninteractive text is confusing.
              - paragraph [ref=f36e141]:
                - strong [ref=f36e142]: Make sure all your app’s colors work well in light, dark, and increased contrast contexts.
                - text: iOS, iPadOS, macOS, and tvOS offer both light and
                - link "dark" [ref=f36e143] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode
                - text: appearance settings.
                - link "System colors" [ref=f36e144] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#System-colors
                - text: vary subtly depending on the system appearance, adjusting to ensure proper color differentiation and contrast for text, symbols, and other elements. With the Increase Contrast setting turned on, the color differences become far more apparent. When possible, use system colors, which already define variants for all these contexts. If you define a custom color, make sure to supply light and dark variants, and an increased contrast option for each variant that provides a significantly higher amount of visual differentiation. Even if your app ships in a single appearance mode, provide both light and dark colors to support Liquid Glass adaptivity in these contexts.
              - generic [ref=f36e145]:
                - paragraph [ref=f36e147]:
                  - figure "Default (light)" [ref=f36e148]:
                    - img "A screenshot of the Notes app in iOS with the light system appearance and default contrast. The Notes app is open to a note with the text 'Note'. The text is selected, which shows a yellow selection highlight and text editing menu. The Done button appears in the upper-right corner. The Liquid Glass background of the button is yellow, and its label, which shows a checkmark, is white. The shade of yellow is vibrant." [ref=f36e152]
                - paragraph [ref=f36e155]:
                  - figure "Increased contrast (light)" [ref=f36e156]:
                    - img "A screenshot of the Notes app in iOS with the light system appearance and increased contrast. The Notes app is open to a note with the text 'Note'. The text is selected, which shows a yellow selection highlight and text editing menu. The Done button appears in the upper-right corner. The Liquid Glass background of the button is yellow, and its label, which shows a checkmark, is black. The shade of yellow is darker to provide more contrast and differentiation against the note's white background." [ref=f36e160]
                - paragraph [ref=f36e163]:
                  - figure "Default (dark)" [ref=f36e164]:
                    - img "A screenshot of the Notes app in iOS with the dark system appearance and default contrast. The Notes app is open to a note with the text 'Note'. The text is selected, which shows a yellow selection highlight and text editing menu. The Done button appears in the upper-right corner. The Liquid Glass background of the button is yellow, and its label, which shows a checkmark, is white." [ref=f36e168]
                - paragraph [ref=f36e171]:
                  - figure "Increased contrast (dark)" [ref=f36e172]:
                    - img "A screenshot of the Notes app in iOS with the dark system appearance and increased contrast. The Notes app is open to a note with the text 'Note'. The text is selected, which shows a yellow selection highlight and text editing menu. The Done button appears in the upper-right corner. The Liquid Glass background of the button is yellow, and its label, which shows a checkmark, is black." [ref=f36e176]
              - paragraph [ref=f36e178]:
                - strong [ref=f36e179]: Test your app’s color scheme under a variety of lighting conditions.
                - text: Colors can look different when you view your app outside on a sunny day or in dim light. In bright surroundings, colors look darker and more muted. In dark environments, colors appear bright and saturated. In visionOS, colors can look different depending on the colors of a wall or object in a person’s physical surroundings and how it reflects light. Adjust app colors to provide an optimal viewing experience in the majority of use cases.
              - paragraph [ref=f36e180]:
                - strong [ref=f36e181]: Test your app on different devices.
                - text: For example, the True Tone display — available on certain iPhone, iPad, and Mac models — uses ambient light sensors to automatically adjust the white point of the display to adapt to the lighting conditions of the current environment. Apps that primarily support reading, photos, video, and gaming can strengthen or weaken this effect by specifying a white point adaptivity style (for developer guidance, see
                - link [ref=f36e182] [cursor=pointer]:
                  - /url: /documentation/bundleresources/information-property-list/uiwhitepointadaptivitystyle
                  - code [ref=f36e183]: UIWhitePointAdaptivityStyle
                - text: ). Test tvOS apps on multiple brands of HD and 4K TVs, and with different display settings. You can also test the appearance of your app using different color profiles on a Mac — such as P3 and Standard RGB (sRGB) — by choosing a profile in System Settings > Displays. For guidance, see
                - link "Color management" [ref=f36e184] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Color-management
                - text: .
              - paragraph [ref=f36e185]:
                - strong [ref=f36e186]: Consider how artwork and translucency affect nearby colors.
                - text: Variations in artwork sometimes warrant changes to nearby colors to maintain visual continuity and prevent interface elements from becoming overpowering or underwhelming. Maps, for example, displays a light color scheme when in map mode but switches to a dark color scheme when in satellite mode. Colors can also appear different when placed behind or applied to a translucent element like a toolbar.
              - paragraph [ref=f36e187]:
                - strong [ref=f36e188]: If your app lets people choose colors, prefer system-provided color controls where available.
                - text: Using built-in color pickers provides a consistent user experience, in addition to letting people save a set of colors they can access from any app. For developer guidance, see
                - link [ref=f36e189] [cursor=pointer]:
                  - /url: /documentation/swiftui/colorpicker
                  - code [ref=f36e190]: ColorPicker
                - text: .
              - heading [level=2] [ref=f36e191]:
                - link "Inclusive color in page link" [ref=f36e192] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Inclusive-color
              - paragraph [ref=f36e193]:
                - strong [ref=f36e194]: Avoid relying solely on color to differentiate between objects, indicate interactivity, or communicate essential information.
                - text: When you use color to convey information, be sure to provide the same information in alternative ways so people with color blindness or other visual disabilities can understand it. For example, you can use text labels or glyph shapes to identify objects or states.
              - paragraph [ref=f36e195]:
                - strong [ref=f36e196]: Avoid using colors that make it hard to perceive content in your app.
                - text: For example, insufficient contrast can cause icons and text to blend with the background and make content hard to read, and people who are color blind might not be able to distinguish some color combinations. For guidance, see
                - link "Accessibility" [ref=f36e197] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility
                - text: .
              - paragraph [ref=f36e198]:
                - strong [ref=f36e199]: Consider how the colors you use might be perceived in other countries and cultures.
                - text: For example, red communicates danger in some cultures, but has positive connotations in other cultures. Make sure the colors in your app send the message you intend.
              - generic [ref=f36e200]:
                - paragraph [ref=f36e202]:
                  - figure "Green indicates a positive trend in the Stocks app in English." [ref=f36e203]:
                    - generic:
                      - img "An illustration of an upward-trending stock chart in the Stocks app in English. The line of the graph is green to indicate the rising value of the stock during the selected time period."
                - paragraph [ref=f36e206]:
                  - figure "Red indicates a positive trend in the Stocks app in Chinese." [ref=f36e207]:
                    - generic:
                      - img "An illustration of an upward-trending stock chart in the Stocks app in Chinese. The line of the graph is red to indicate the rising value of the stock during the selected time period."
              - heading [level=2] [ref=f36e209]:
                - link "System colors in page link" [ref=f36e210] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#System-colors
              - paragraph [ref=f36e211]:
                - strong [ref=f36e212]: Avoid hard-coding system color values in your app.
                - text: Documented color values are for your reference during the app design process. The actual color values may fluctuate from release to release, based on a variety of environmental variables. Use APIs like
                - link [ref=f36e213] [cursor=pointer]:
                  - /url: /documentation/swiftui/color
                  - code [ref=f36e214]: Color
                - text: to apply system colors.
              - paragraph [ref=f36e215]:
                - text: iOS, iPadOS, macOS, and visionOS also define sets of
                - emphasis [ref=f36e216]: dynamic system colors
                - text: that match the color schemes of standard UI components and automatically adapt to both light and dark contexts. Each dynamic color is semantically defined by its purpose, rather than its appearance or color values. For example, some colors represent view backgrounds at different levels of hierarchy and other colors represent foreground content, such as labels, links, and separators.
              - paragraph [ref=f36e217]:
                - strong [ref=f36e218]: Avoid redefining the semantic meanings of dynamic system colors.
                - text: To ensure a consistent experience and ensure your interface looks great when the appearance of the platform changes, use dynamic system colors as intended. For example, don’t use the
                - link "separator" [ref=f36e219] [cursor=pointer]:
                  - /url: https://developer.apple.com/documentation/uikit/uicolor/separator
                - text: color as a text color, or
                - link "secondary text label" [ref=f36e220] [cursor=pointer]:
                  - /url: https://developer.apple.com/documentation/uikit/uicolor/secondarylabel
                - text: color as a background color.
              - heading [level=2] [ref=f36e221]:
                - link "Liquid Glass color in page link" [ref=f36e222] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Liquid-Glass-color
              - paragraph [ref=f36e223]:
                - text: By default,
                - link "Liquid Glass" [ref=f36e224] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#Liquid-Glass
                - text: has no inherent color, and instead takes on colors from the content directly behind it. You can apply color to some Liquid Glass elements, giving them the appearance of colored or stained glass. This is useful for drawing emphasis to a specific control, like a primary call to action, and is the approach the system uses for prominent button styling. Symbols or text labels on Liquid Glass controls can also have color.
              - generic [ref=f36e225]:
                - paragraph [ref=f36e227]:
                  - figure "Controls can use color in the Liquid Glass background, like in a primary action button." [ref=f36e228]:
                    - generic:
                      - img "A screenshot of the Done button in iOS, which appears as a checkmark on a blue Liquid Glass background."
                - paragraph [ref=f36e231]:
                  - figure "Symbols and text that appear on Liquid Glass can have color, like in a selected tab bar item." [ref=f36e232]:
                    - generic:
                      - img "A screenshot of a tab bar in iOS, with the first tab selected. The symbol and text label of the selected tab bar item are blue."
                - paragraph [ref=f36e235]:
                  - figure "By default, Liquid Glass picks up the color from the content layer behind it." [ref=f36e236]:
                    - generic:
                      - img "A screenshot of the Share button in iOS over a colorful image. The colors from the background image infuse the Liquid Glass in the button, affecting its color."
              - paragraph [ref=f36e238]: For smaller elements like toolbars and tab bars, the system can adapt Liquid Glass between a light and dark appearance in response to the underlying content. By default, symbols and text on these elements follow a monochromatic color scheme, becoming darker when the underlying content is light, and lighter when it’s dark. Liquid Glass appears more opaque in larger elements like sidebars to preserve legibility over complex backgrounds and accommodate richer content on the material’s surface.
              - paragraph [ref=f36e239]:
                - strong [ref=f36e240]: Apply color sparingly to the Liquid Glass material, and to symbols or text on the material.
                - text: If you apply color, reserve it for elements that truly benefit from emphasis, such as status indicators or primary actions. To emphasize primary actions, apply color to the background rather than to symbols or text. For example, the system applies the app accent color to the background in prominent buttons — such as the Done button — to draw attention and elevate their visual prominence. Refrain from adding color to the background of multiple controls.
              - generic [ref=f36e241]:
                - generic [ref=f36e242]:
                  - paragraph [ref=f36e243]:
                    - img "A screenshot of the top half of an iPhone app that shows a toolbar with several buttons. All of the buttons in the toolbar use a blue accent color for their Liquid Glass background." [ref=f36e247]
                  - paragraph:
                    - generic:
                      - img "An X in a circle to indicate incorrect usage."
                - generic [ref=f36e248]:
                  - paragraph [ref=f36e249]:
                    - img "A screenshot of the top half of an iPhone app that shows a toolbar with several buttons. Only the Done button in the toolbar uses a blue accent color for its Liquid Glass background." [ref=f36e253]
                  - paragraph:
                    - generic:
                      - img "A checkmark in a circle to indicate correct usage."
              - paragraph [ref=f36e254]:
                - strong [ref=f36e255]: Avoid using similar colors in control labels if your app has a colorful background.
                - text: While color can make apps more visually appealing, playful, or reflective of your brand, too much color can be overwhelming and make control labels more difficult to read. If your app features colorful backgrounds or visually rich content, prefer a monochromatic appearance for toolbars and tab bars, or choose an accent color with sufficient visual differentiation. By contrast, in apps with primarily monochromatic content or backgrounds, choosing your brand color as the app accent color can be an effective way to tailor your app experience and reflect your company’s identity.
              - paragraph [ref=f36e256]:
                - strong [ref=f36e257]: Be aware of the placement of color in the content layer.
                - text: Make sure your interface maintains sufficient contrast by avoiding overlap of similar colors in the content layer and controls when possible. Although colorful content might intermittently scroll underneath controls, make sure its default or resting state — like the top of a screen of scrollable content — maintains clear legibility.
              - heading [level=2] [ref=f36e258]:
                - link "Color management in page link" [ref=f36e259] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Color-management
              - paragraph [ref=f36e260]:
                - text: A
                - emphasis [ref=f36e261]: color space
                - text: represents the colors in a
                - emphasis [ref=f36e262]: color model
                - text: like RGB or CMYK. Common color spaces — sometimes called
                - emphasis [ref=f36e263]: gamuts
                - text: — are sRGB and Display P3.
              - paragraph:
                - generic:
                  - img "Diagram showing the colors included in the sRGB space, compared to the larger number of colors included in the P3 color space."
              - paragraph [ref=f36e264]:
                - text: A
                - emphasis [ref=f36e265]: color profile
                - text: describes the colors in a color space using, for example, mathematical formulas or tables of data that map colors to numerical representations. An image embeds its color profile so that a device can interpret the image’s colors correctly and reproduce them on a display.
              - paragraph [ref=f36e266]:
                - strong [ref=f36e267]: Apply color profiles to your images.
                - text: Color profiles help ensure that your app’s colors appear as intended on different displays. The sRGB color space produces accurate colors on most displays.
              - paragraph [ref=f36e268]:
                - strong [ref=f36e269]: Use wide color to enhance the visual experience on compatible displays.
                - text: Wide color displays support a P3 color space, which can produce richer, more saturated colors than sRGB. As a result, photos and videos that use wide color are more lifelike, and visual data and status indicators that use wide color can be more meaningful. When appropriate, use the Display P3 color profile at 16 bits per pixel (per channel) and export images in PNG format. Note that you need to use a wide color display to design wide color images and select P3 colors.
              - paragraph [ref=f36e270]:
                - strong [ref=f36e271]: Provide color space–specific image and color variations if necessary.
                - text: In general, P3 colors and images appear fine on sRGB displays. Occasionally, it may be hard to distinguish two very similar P3 colors when viewing them on an sRGB display. Gradients that use P3 colors can also sometimes appear clipped on sRGB displays. To avoid these issues and to ensure visual fidelity on both wide color and sRGB displays, you can use the asset catalog of your Xcode project to provide different versions of images and colors for each color space.
              - heading [level=2] [ref=f36e272]:
                - link "Platform considerations in page link" [ref=f36e273] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Platform-considerations
              - heading [level=3] [ref=f36e274]:
                - link "iOS, iPadOS in page link" [ref=f36e275] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#iOS-iPadOS
              - paragraph [ref=f36e276]:
                - text: iOS defines two sets of dynamic background colors —
                - emphasis [ref=f36e277]: system
                - text: and
                - emphasis [ref=f36e278]: grouped
                - text: — each of which contains primary, secondary, and tertiary variants that help you convey a hierarchy of information. In general, use the grouped background colors (
                - link [ref=f36e279] [cursor=pointer]:
                  - /url: /documentation/uikit/uicolor/systemgroupedbackground
                  - code [ref=f36e280]: systemGroupedBackground
                - text: ","
                - link [ref=f36e281] [cursor=pointer]:
                  - /url: /documentation/uikit/uicolor/secondarysystemgroupedbackground
                  - code [ref=f36e282]: secondarySystemGroupedBackground
                - text: ", and"
                - link [ref=f36e283] [cursor=pointer]:
                  - /url: /documentation/uikit/uicolor/tertiarysystemgroupedbackground
                  - code [ref=f36e284]: tertiarySystemGroupedBackground
                - text: ) when you have a grouped table view; otherwise, use the system set of background colors (
                - link [ref=f36e285] [cursor=pointer]:
                  - /url: /documentation/uikit/uicolor/systembackground
                  - code [ref=f36e286]: systemBackground
                - text: ","
                - link [ref=f36e287] [cursor=pointer]:
                  - /url: /documentation/uikit/uicolor/secondarysystembackground
                  - code [ref=f36e288]: secondarySystemBackground
                - text: ", and"
                - link [ref=f36e289] [cursor=pointer]:
                  - /url: /documentation/uikit/uicolor/tertiarysystembackground
                  - code [ref=f36e290]: tertiarySystemBackground
                - text: ).
              - paragraph [ref=f36e291]: "With both sets of background colors, you generally use the variants to indicate hierarchy in the following ways:"
              - list [ref=f36e292]:
                - listitem [ref=f36e293]:
                  - paragraph [ref=f36e294]: Primary for the overall view
                - listitem [ref=f36e295]:
