              - heading [level=4] [ref=f36e712]:
                - link "App accent colors in page link" [ref=f36e713] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#App-accent-colors
              - paragraph [ref=f36e714]:
                - text: Beginning in macOS 11, you can specify an
                - emphasis [ref=f36e715]: accent color
                - text: to customize the appearance of your app’s buttons, selection highlighting, and sidebar icons. The system applies your accent color when the current value in General > Accent color settings is
                - emphasis [ref=f36e716]: multicolor
                - text: .
              - paragraph:
                - generic:
                  - img "A screenshot of the accent color picker in the System Settings app."
              - paragraph [ref=f36e717]:
                - text: If people set their accent color setting to a value other than multicolor, the system applies their chosen color to the relevant items throughout your app, replacing your accent color. The exception is a sidebar icon that uses a fixed color you specify. Because a fixed-color sidebar icon uses a specific color to provide meaning, the system doesn’t override its color when people change the value of accent color settings. For guidance, see
                - link "Sidebars" [ref=f36e718] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/sidebars
                - text: .
              - heading [level=3] [ref=f36e719]:
                - link "tvOS in page link" [ref=f36e720] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#tvOS
              - paragraph [ref=f36e721]:
                - strong [ref=f36e722]: Consider choosing a limited color palette that coordinates with your app logo.
                - text: Subtle use of color can help you communicate your brand while deferring to the content.
              - paragraph [ref=f36e723]:
                - strong [ref=f36e724]: Avoid using only color to indicate focus.
                - text: Subtle scaling and responsive animation are the primary ways to denote interactivity when an element is in focus.
              - heading [level=3] [ref=f36e725]:
                - link "visionOS in page link" [ref=f36e726] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#visionOS
              - paragraph [ref=f36e727]:
                - strong [ref=f36e728]: Use color sparingly, especially on glass.
                - text: Standard visionOS windows typically use the system-defined glass
                - link "material" [ref=f36e729] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials
                - text: ", which lets light and objects from people’s physical surroundings and their space show through. Because the colors in these physical and virtual objects are visible through the glass, they can affect the legibility of colorful app content in the window. Prefer using color in places where it can help call attention to important information or show the relationship between parts of the interface."
              - paragraph [ref=f36e730]:
                - strong [ref=f36e731]: Prefer using color in bold text and large areas.
                - text: Color in lightweight text or small areas can make them harder to see and understand.
              - paragraph [ref=f36e732]:
                - strong [ref=f36e733]: In a fully immersive experience, help people maintain visual comfort by keeping brightness levels balanced.
                - text: Although using high contrast can help direct people’s attention to important content, it can also cause visual discomfort if people’s eyes have adjusted to low light or darkness. Consider making content fully bright only when the rest of the visual context is also bright. For example, avoid displaying a bright object on a very dark or black background, especially if the object flashes or moves.
              - heading [level=3] [ref=f36e734]:
                - link "watchOS in page link" [ref=f36e735] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#watchOS
              - paragraph [ref=f36e736]:
                - strong [ref=f36e737]: Use background color to support existing content or supply additional information.
                - text: Background color can establish a sense of place and help people recognize key content. For example, in Activity, each infographic view for the Move, Exercise, and Stand Activity rings has a background that matches the color of the ring. Use background color when you have something to communicate, rather than as a solely visual flourish. Avoid using full-screen background color in views that are likely to remain onscreen for long periods of time, such as in a workout or audio-playing app.
              - paragraph [ref=f36e738]:
                - strong [ref=f36e739]: Recognize that people might prefer graphic complications to use tinted mode instead of full color.
                - text: The system can use a single color that’s based on the wearer’s selected color in a graphic complication’s images, gauges, and text. For guidance, see
                - link "Complications" [ref=f36e740] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/complications
                - text: .
              - heading [level=2] [ref=f36e741]:
                - link "Specifications in page link" [ref=f36e742] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Specifications
