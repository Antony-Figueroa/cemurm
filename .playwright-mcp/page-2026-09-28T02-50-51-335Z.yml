          - main [ref=f38e403]:
            - generic [ref=f38e406]:
              - complementary "note" [ref=f38e407]:
                - paragraph [ref=f38e408]: September 9, 2026
                - text: Updated guidance to reflect current best practices.
              - heading "Layout" [level=1] [ref=f38e410]
              - generic [ref=f38e411]: A consistent layout that adapts across display sizes, orientations, and multitasking configurations helps people understand and enjoy your app or game on all their devices.
            - generic [ref=f38e416]:
              - paragraph [ref=f38e417]:
                - img "A sketch of a small rectangle in the upper-left quadrant of a larger rectangle, suggesting the position of a user interface element within a window. The image is overlaid with rectangular and circular grid lines and is tinted yellow to subtly reflect the yellow in the original six-color Apple logo." [ref=f38e419]
              - paragraph [ref=f38e420]: Your layout provides the structure for people to understand your content from the moment they open your app. Familiar relationships between controls and content let people use and discover features right away, and make your design feel at home on every platform.
              - paragraph [ref=f38e421]:
                - text: Apple provides templates and layout guides that can help you integrate Apple technologies and design your apps and games to run on all Apple platforms. See
                - link "Apple Design Resources" [ref=f38e422] [cursor=pointer]:
                  - /url: https://developer.apple.com/design/resources/
                - text: .
              - heading [level=2] [ref=f38e423]:
                - link "Visual hierarchy in page link" [ref=f38e424] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#Visual-hierarchy
              - paragraph [ref=f38e425]:
                - strong [ref=f38e426]: Order content by relative importance.
                - text: People often start by viewing content in reading order — that is, from top to bottom and from the leading to trailing side — so place the most important items near the top and leading side of the window or display. To support right-to-left languages, prefer standard system components that can automatically adapt UI elements to better reflect each language’s natural reading order. For guidance, see
                - link "Right to left" [ref=f38e427] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/right-to-left
                - text: .
              - paragraph [ref=f38e428]:
                - strong [ref=f38e429]: Align elements to make them easier to scan, and use indentation to convey hierarchy.
                - text: Alignment makes an app look neat and organized, and can help people track content while scrolling or moving their eyes. People assume that aligned items are related to each other, and conversely, they perceive indented items as subordinate to the item they follow. Because of this, using alignment and indentation deliberately can help people understand your information hierarchy.
              - paragraph [ref=f38e430]:
                - strong [ref=f38e431]: Group related items to clearly express related information or functions.
                - text: For example, you might use negative space, container shapes, or separator lines to show which elements are related and which are unrelated.
              - paragraph [ref=f38e432]:
                - strong [ref=f38e433]: Use progressive disclosure to make layouts cleaner and easier to interact with.
                - text: An interface with too much content and too many choices makes it harder to find information quickly, and harder to understand the choices that are available. Use disclosure triangles, menus, or nested views to reduce how much content to initially display; or use scrollable sections to showcase additional content, which is particularly useful for media-focused apps like those for video, music, or books.
              - paragraph [ref=f38e434]:
                - strong [ref=f38e435]: Differentiate controls from content.
                - text: Take advantage of the Liquid Glass material on all platforms that support it to provide a distinct appearance for your controls. Instead of applying a solid or semi-opaque background color beneath controls, use a scroll edge effect to visually elevate controls above content. For guidance, see
                - link "Scroll views" [ref=f38e436] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/scroll-views
                - text: . For full-screen background content, be sure to extend it underneath sidebars, toolbars, and tab bars to fit the entire screen or window.
              - paragraph [ref=f38e437]:
                - text: If scaling a background image to the full window edge results in components like sidebars or inspectors covering important parts of the image, you can use a background extension effect to flip and blur the image, mirroring it beneath adjacent components and providing the appearance that the background image extends beneath them. For developer guidance, see
                - link [ref=f38e438] [cursor=pointer]:
                  - /url: /documentation/swiftui/view/backgroundextensioneffect()
                  - code [ref=f38e439]: backgroundExtensionEffect()
                - text: and
                - link [ref=f38e440] [cursor=pointer]:
                  - /url: /documentation/uikit/uibackgroundextensionview
                  - code [ref=f38e441]: UIBackgroundExtensionView
                - text: .
              - paragraph [ref=f38e442]:
                - img "A screenshot of a full-screen iPad app with a sidebar on the leading edge. A photo of Mount Fuji fills the top half of the content area. The photo subtly blurs as it reaches the top of the screen, where toolbar items float above it grouped on the trailing edge. Where the photo meets the sidebar, the image flips, blurs, and extends fully beneath the sidebar to the edge of the screen." [ref=f38e446]
              - heading [level=2] [ref=f38e447]:
                - link "Adaptability in page link" [ref=f38e448] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#Adaptability
              - paragraph [ref=f38e449]: Apps and games need to adapt to different display sizes, orientation changes, window sizes, and multitasking states. In iOS, iPadOS, tvOS, and visionOS, the system defines characteristics of the device environment that can affect the way your app or game looks. Use SwiftUI or Auto Layout to ensure that your interface adapts to them.
              - paragraph [ref=f38e450]: "Here are some of the most common device and system characteristics that apps need to handle:"
              - list [ref=f38e451]:
                - listitem [ref=f38e452]:
                  - paragraph [ref=f38e453]:
                    - text: Regular and compact horizontal and vertical
                    - link "size classes" [ref=f38e454] [cursor=pointer]:
                      - /url: /design/human-interface-guidelines/layout#Size-classes
                - listitem [ref=f38e455]:
                  - paragraph [ref=f38e456]: Different device screen sizes
                - listitem [ref=f38e457]:
                  - paragraph [ref=f38e458]: Different device orientations and aspect ratios
                - listitem [ref=f38e459]:
                  - paragraph [ref=f38e460]: System features like the Dynamic Island
                - listitem [ref=f38e461]:
                  - paragraph [ref=f38e462]: External display support, Display Zoom, and resizable windows on iPad and Mac
                - listitem [ref=f38e463]:
                  - paragraph [ref=f38e464]: Text-size changes
                - listitem [ref=f38e465]:
                  - paragraph [ref=f38e466]: Locale-based internationalization features like left-to-right/right-to-left layout direction, date/time/number formatting, font variation, and text length
              - paragraph [ref=f38e467]:
                - strong [ref=f38e468]: Design a layout that adapts gracefully and consistently.
                - text: People expect your experience to remain familiar when they rotate their device, resize a window, add another display, or switch to a different device. You can help ensure an adaptable interface by respecting system-defined safe areas, margins, and guides (where available) and specifying layout modifiers to fine-tune the placement of views in your interface.
              - paragraph [ref=f38e469]: Even if your app is locked to a certain orientation, such as a landscape-only game, it’s still important to ensure your interface resizes well to provide the best experience across devices and window sizes.
              - paragraph [ref=f38e470]:
                - strong [ref=f38e471]: Be prepared for text-size changes.
                - text: People use
                - link "Dynamic Type" [ref=f38e472] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/typography#Supporting-Dynamic-Type
                - text: to increase text size to be more readable, which occurs at the system level. Apps that don’t respond to this setting can be difficult or impossible to use for people who rely on this feature. Support Dynamic Type by adjusting your layout to accommodate text at larger sizes. For example, horizontally adjacent views may need to stack vertically to provide more space for text; table rows or other containers may need to grow in height so that text isn’t cropped or doesn’t overlap other content; and table rows with a single line of text by default might need to grow vertically to accommodate multiple lines of text.
              - paragraph [ref=f38e473]:
                - text: To support Dynamic Type in your Unity-based game, use Apple’s accessibility plug-in (for developer guidance, see
                - link "Apple – Accessibility" [ref=f38e474] [cursor=pointer]:
                  - /url: https://github.com/apple/unityplugins/blob/main/plug-ins/Apple.Accessibility/Apple.Accessibility_Unity/Assets/Apple.Accessibility/Documentation~/Apple.Accessibility.md
                - text: ). For guidance on displaying text in your app, see
                - link "Typography" [ref=f38e475] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/typography
                - text: .
              - paragraph [ref=f38e476]:
                - strong [ref=f38e477]: Preview your app on multiple devices, using different size classes, localizations, and text sizes.
                - text: You can streamline the testing process by first testing versions of your experience that use the largest and the smallest layouts. You can test on a simulated device in
                - link "Device Hub" [ref=f38e478] [cursor=pointer]:
                  - /url: /documentation/xcode/device-hub
                - text: to check for clipping and other layout issues. For example, you can use Device Hub to make sure your layout looks great when your app is resized on iPad or in iPhone Mirroring on Mac.
              - paragraph [ref=f38e479]:
                - strong [ref=f38e480]: When necessary, scale background artwork in response to display changes.
                - text: Viewing your app or game in a different context — such as on a screen with a different aspect ratio — might make your artwork appear cropped, letterboxed, or pillarboxed. If this happens, don’t change the aspect ratio of the artwork; instead, scale it so that it fills the screen completely. Note that since windows can be very wide and short or tall and narrow, background artwork may often need to extend beyond what is typically visible in a more standard display aspect ratio.
              - heading [level=3] [ref=f38e481]:
                - link "Size classes in page link" [ref=f38e482] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#Size-classes
              - paragraph [ref=f38e483]: In iOS and iPadOS, size classes are an indication of how much horizontal and vertical space is available to an app’s interface.
              - paragraph [ref=f38e484]:
                - text: "Each dimension — horizontal and vertical — is represented by one of two size classes:"
                - emphasis [ref=f38e485]: compact
                - text: or
                - emphasis [ref=f38e486]: regular
                - text: . The horizontal size class determines whether an app is narrow (compact) or wide (regular), while the vertical size class determines whether it is short (compact) or tall (regular).
              - paragraph [ref=f38e487]:
                - text: The system sets size classes based on the device type,
                - link "window" [ref=f38e488] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/windows
                - text: configuration, and
                - link "multitasking" [ref=f38e489] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/multitasking
                - text: state; for example, whether an app is full screen, in Slide Over, or mirrored from an iPhone to a Mac. Depending on their environment, iOS and iPadOS apps can exist in every combination of size classes.
              - generic [ref=f38e490]:
                - paragraph [ref=f38e492]:
                  - figure "Compact width, compact height" [ref=f38e493]:
                    - img "An illustration of an iPad in landscape orientation with an empty app window in the center of the screen. The window is narrow and short, and occupies roughly a quarter of the screen." [ref=f38e497]
                - paragraph [ref=f38e500]:
                  - figure "Compact width, regular height" [ref=f38e501]:
                    - img "An illustration of an iPad in landscape orientation with an empty app window in the center of the screen. The window is narrow and tall, and occupies roughly half of the screen." [ref=f38e505]
              - generic [ref=f38e507]:
                - paragraph [ref=f38e509]:
                  - figure "Regular width, compact height" [ref=f38e510]:
                    - img "An illustration of an iPad in landscape orientation with an empty app window in the center of the screen. The window is wide and short, and occupies roughly half of the screen." [ref=f38e514]
                - paragraph [ref=f38e517]:
                  - figure "Regular width, regular height" [ref=f38e518]:
                    - img "An illustration of an iPad in landscape orientation with an empty app window in the center of the screen. The window is wide and tall, and occupies most of the screen." [ref=f38e522]
              - paragraph [ref=f38e524]:
                - text: For developer guidance, see
                - link [ref=f38e525] [cursor=pointer]:
                  - /url: /documentation/uikit/uitraitchangeobservable-67e94
                  - code [ref=f38e526]: UITraitChangeObservable
                - text: and
                - link [ref=f38e527] [cursor=pointer]:
                  - /url: /documentation/swiftui/userinterfacesizeclass
                  - code [ref=f38e528]: UserInterfaceSizeClass
                - text: .
              - paragraph [ref=f38e529]:
                - strong [ref=f38e530]: Determine layout based on size classes, not device type or orientation.
                - text: Size classes describe the actual space available, regardless of whether an app is in portrait or landscape. Conversely, a device’s orientation and type (also called its
                - emphasis [ref=f38e531]: idiom
                - text: ) aren’t useful for making layout decisions because they don’t provide your app with information about how much space is available.
              - paragraph [ref=f38e532]: Size classes also let your app’s interface adapt to a wide range of window sizes. For example, when a person runs your app in macOS with iPhone Mirroring, they can freely resize its width and height; or they can resize an iPad app when multitasking in iPadOS or when running it in macOS.
              - paragraph [ref=f38e533]:
                - strong [ref=f38e534]: Consider all possible combinations of size classes.
                - text: Your app can appear in a variety of size classes in both portrait and landscape aspect ratios, and it’s important to consider all of them to provide a good experience. A layout solely designed for landscape on iPhone with regular width and compact height might not take advantage of the vertical space available on iPad in landscape when someone resizes the window to regular height. Conversely, designing exclusively for compact portrait could leave extra space when someone resizes the app window to a regular width on iPad.
              - paragraph [ref=f38e535]:
                - strong [ref=f38e536]: Keep functionality the same as size classes change, and keep layout changes recognizable and familiar to the platform.
                - text: Don’t change your app’s functionality based on the space it occupies. However, you can change the amount of functionality that’s visible onscreen as the amount of space changes. Consider taking advantage of larger spaces to switch from a
                - link "tab bar" [ref=f38e537] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/tab-bars
                - text: to a
                - link "sidebar" [ref=f38e538] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/sidebars
                - text: or expose functionality that might otherwise be grouped into an overflow menu.
              - paragraph [ref=f38e539]: "Similarly, while an app’s size classes might change when someone resizes it, its idiom — the device type it’s made for — remains the same: keep the layout recognizable and familiar to the platform even when resizing."
              - heading [level=2] [ref=f38e540]:
                - link "Guides and safe areas in page link" [ref=f38e541] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#Guides-and-safe-areas
              - paragraph [ref=f38e542]:
                - text: A
                - emphasis [ref=f38e543]: layout guide
                - text: defines a rectangular region that helps you position, align, and space your content on the screen. The system includes predefined layout guides that make it easy to apply standard margins around content and restrict the width of text for optimal readability. You can also define custom layout guides. For developer guidance, see
                - link [ref=f38e544] [cursor=pointer]:
                  - /url: /documentation/uikit/uilayoutguide
                  - code [ref=f38e545]: UILayoutGuide
                - text: and
                - link [ref=f38e546] [cursor=pointer]:
                  - /url: /documentation/appkit/nslayoutguide
                  - code [ref=f38e547]: NSLayoutGuide
                - text: .
              - paragraph [ref=f38e548]:
                - text: A
                - emphasis [ref=f38e549]: safe area
                - text: defines the area within a window that isn’t covered on the edge by a hardware feature or another view within the window, like a toolbar, tab bar, or status bar. Respecting the safe area is essential to make sure system UI and hardware features like the Dynamic Island don’t obstruct content and controls. For developer guidance, see
                - link [ref=f38e550] [cursor=pointer]:
                  - /url: /documentation/swiftui/safearearegions
                  - code [ref=f38e551]: SafeAreaRegions
                - text: and
                - link "Positioning content relative to the safe area" [ref=f38e552] [cursor=pointer]:
                  - /url: /documentation/uikit/positioning-content-relative-to-the-safe-area
                - text: .
              - heading [level=2] [ref=f38e553]:
                - link "Platform considerations in page link" [ref=f38e554] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#Platform-considerations
              - paragraph [ref=f38e555]:
                - emphasis [ref=f38e556]: No additional considerations for iOS or iPadOS.
              - heading [level=3] [ref=f38e557]:
                - link "macOS in page link" [ref=f38e558] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#macOS
              - paragraph [ref=f38e559]:
                - strong [ref=f38e560]: Avoid placing controls or critical information at the bottom of a window.
                - text: People often move windows so that the bottom edge is below the bottom of the screen.
              - paragraph [ref=f38e561]:
                - strong [ref=f38e562]: Avoid displaying content behind the camera housing at the top edge of the window.
                - text: For developer guidance, see
                - link [ref=f38e563] [cursor=pointer]:
                  - /url: /documentation/bundleresources/information-property-list/nsprefersdisplaysafeareacompatibilitymode
                  - code [ref=f38e564]: NSPrefersDisplaySafeAreaCompatibilityMode
                - text: .
              - heading [level=3] [ref=f38e565]:
                - link "tvOS in page link" [ref=f38e566] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#tvOS
              - paragraph [ref=f38e567]:
                - strong [ref=f38e568]: Adhere to the screen’s safe area.
                - text: Inset primary content 60 points from the top and bottom of the screen, and 80 points from the sides. Providing these margins ensures your content is visible regardless of TV compatibility settings or overscan cropping.
              - paragraph:
                - generic:
                  - img "An illustration of a TV with a safe zone border on all sides. In width, the top and bottom borders measure 60 points, and the side borders both measure 80 points."
              - paragraph [ref=f38e569]:
                - strong [ref=f38e570]: Include appropriate padding between focusable elements.
                - text: When you use UIKit and the focus APIs, an element gets bigger when it comes into focus. Consider how elements look when they’re focused, and make sure you don’t let them overlap important information. For developer guidance, see
                - link "About focus interactions for Apple TV" [ref=f38e571] [cursor=pointer]:
                  - /url: /documentation/uikit/about-focus-interactions-for-apple-tv
                - text: .
              - paragraph:
                - generic:
                  - img "An illustration that uses vertical shaded rectangles to show padding between focusable items."
              - heading [level=4] [ref=f38e572]:
                - link "Grids in page link" [ref=f38e573] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#Grids
              - paragraph [ref=f38e574]: The following grid layouts provide an optimal viewing experience. Be sure to use appropriate spacing between unfocused rows and columns to prevent overlap when an item comes into focus.
              - paragraph [ref=f38e575]:
                - text: If you use the UIKit collection view flow element, the number of columns in a grid is automatically determined based on the width and spacing of your content. For developer guidance, see
                - link [ref=f38e576] [cursor=pointer]:
                  - /url: /documentation/uikit/uicollectionviewflowlayout
                  - code [ref=f38e577]: UICollectionViewFlowLayout
                - text: .
