              - paragraph [ref=f38e629]:
                - strong [ref=f38e630]: Include additional vertical spacing for titled rows.
                - text: If a row has a title, provide enough spacing between the bottom of the previous unfocused row and the center of the title to avoid crowding. Also provide spacing between the bottom of the title and the top of the unfocused items in the row.
              - paragraph [ref=f38e631]:
                - strong [ref=f38e632]: Use consistent spacing.
                - text: When content isn’t consistently spaced, it no longer looks like a grid and it’s harder for people to scan.
              - paragraph [ref=f38e633]:
                - strong [ref=f38e634]: Make partially hidden content look symmetrical.
                - text: To help direct attention to the fully visible content, keep partially hidden offscreen content the same width on each side of the screen.
              - heading [level=3] [ref=f38e635]:
                - link "visionOS in page link" [ref=f38e636] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#visionOS
              - paragraph [ref=f38e637]:
                - text: In visionOS, you can lay out content within a window, a bounded 3D volume, or an immersive space. The guidance below focuses on laying out content in a window or volume; for guidance on displaying content spatially and best practices for using depth, scale, and positioning, see
                - link "Spatial layout" [ref=f38e638] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/spatial-layout
                - text: . To learn more about windows and volumes in visionOS, see
                - link "Windows > visionOS" [ref=f38e639] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/windows#visionOS
                - text: .
              - paragraph [ref=f38e640]:
                - strong [ref=f38e641]: In general, support resizing.
                - text: The ability to resize windows and volumes is standard behavior in visionOS, just as in macOS and iPadOS. When you allow resizing, make sure your layout adapts well as it changes size, and prefer to keep content horizontally centered at very large sizes so people can easily view and interact with it.
              - paragraph [ref=f38e642]:
                - text: You can also choose to set a minimum and maximum size for windows, volumes, and attached UI elements like ornaments. Use these settings to keep elements from overlapping at small sizes, and to keep large layouts from becoming too unwieldy; but don’t use minimum and maximum sizes as a way to prevent resizing. For example, in Safari, people can resize browser windows, but the custom navigation bar ornament has a fixed maximum size so that controls remain easy to access. For developer guidance, see
                - link "Positioning and sizing windows" [ref=f38e643] [cursor=pointer]:
                  - /url: /documentation/visionos/positioning-and-sizing-windows
                - text: .
              - paragraph [ref=f38e644]:
                - strong [ref=f38e645]: Use 3D content sparingly in windows.
                - text: While windows in visionOS can display 3D content at a fixed depth, reserve this for meaningful moments alongside 2D content. For example, an educational app might display an inline 3D model of a rocket next to information about the model. When displaying 3D content inline, place it inset in the window to avoid it colliding with other content or controls, or appearing unpredictably outside the window edge.
              - paragraph [ref=f38e646]: To display larger models or views that primarily consist of 3D content, consider using a volume or placing content in an immersive space.
              - paragraph [ref=f38e647]:
                - strong [ref=f38e648]: Display supplemental content in an adjacent window, not in an ornament.
                - text: While
                - link "ornaments" [ref=f38e649] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/ornaments
                - text: are flexible enough to act as custom components, they are best for app-specific interactive controls like toolbars and video playback controls, not supplemental content. To display a supplemental content view, open a new window next to the current one using
                - link [ref=f38e650] [cursor=pointer]:
                  - /url: /documentation/swiftui/scene/defaultwindowplacement(_:)
                  - code [ref=f38e651]: defaultWindowPlacement(_:)
                - text: instead of placing the content in an ornament. For developer guidance, see
                - link "Positioning and sizing windows" [ref=f38e652] [cursor=pointer]:
                  - /url: /documentation/visionos/positioning-and-sizing-windows
                - text: .
              - paragraph [ref=f38e653]:
                - strong [ref=f38e654]: Include enough space around controls for them to be easy to interact with.
                - text: Put enough space around controls to make them clearly identifiable, and to prevent the system-provided hover effect from obscuring other content. For example, place buttons so their centers are at least 60 points apart. For guidance, see
                - link "Eyes" [ref=f38e655] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/eyes
                - text: ","
                - link "Spatial layout" [ref=f38e656] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/spatial-layout
                - text: ", and"
                - link "Buttons > visionOS" [ref=f38e657] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/buttons#visionOS
                - text: .
              - heading [level=3] [ref=f38e658]:
                - link "watchOS in page link" [ref=f38e659] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/layout#watchOS
              - paragraph [ref=f38e660]:
                - strong [ref=f38e661]: Avoid placing more than two or three controls side by side in your interface.
                - text: As a general rule, display no more than three buttons that contain glyphs — or two buttons that contain text — in a row. Although it’s usually better to let text buttons span the full width of the screen, two side-by-side buttons with short text labels can also work well, as long as the screen doesn’t scroll.
              - paragraph [ref=f38e662]:
                - img "A diagram of an Apple Watch screen showing two side-by-side buttons beneath three lines of text." [ref=f38e666]
              - paragraph [ref=f38e667]:
                - strong [ref=f38e668]: Support autorotation in views people might want to show others.
                - text: When people flip their wrist away, apps typically respond to the motion by sleeping the display, but in some cases it makes sense to autorotate the content. For example, a wearer might want to show an image to a friend or display a QR code to a reader. For developer guidance, see
                - link [ref=f38e669] [cursor=pointer]:
                  - /url: /documentation/watchkit/wkextension/isautorotating
                  - code [ref=f38e670]: isAutorotating
                - text: .
