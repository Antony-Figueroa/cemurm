                - text: .
              - paragraph [ref=f34e566]:
                - strong [ref=f34e567]: Choose when to allow vibrancy in custom views and controls.
                - text: Depending on configuration and system settings, system views and controls use vibrancy to make foreground content stand out against any background. Test your interface in a variety of contexts to discover when vibrancy enhances the appearance and improves communication.
              - paragraph [ref=f34e568]:
                - strong [ref=f34e569]: Choose a background blending mode that complements your interface design.
                - text: "macOS defines two modes that blend background content: behind window and within window. For developer guidance, see"
