            - generic [ref=f34e403]:
              - heading "Materials" [level=1] [ref=f34e405]
              - generic [ref=f34e406]: A material is a visual effect that creates a sense of depth, layering, and hierarchy between foreground and background elements.
            - generic [ref=f34e411]:
              - paragraph [ref=f34e412]:
                - img "A sketch of a capsule shape overlapping a square. A subtle bend in the edges of the square that are beneath the capsule suggests the layering of the Liquid Glass material over background content. The image is overlaid with rectangular and circular grid lines and is tinted yellow to subtly reflect the yellow in the original six-color Apple logo." [ref=f34e414]
              - paragraph [ref=f34e415]: Materials help visually separate foreground elements, such as text and controls, from background elements, such as content and solid colors. By allowing color to pass through from background to foreground, a material establishes visual hierarchy to help people more easily retain a sense of place.
              - paragraph [ref=f34e416]:
                - text: "Apple platforms feature two types of materials: Liquid Glass, and standard materials."
                - link "Liquid Glass" [ref=f34e417] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#Liquid-Glass
                - text: is a dynamic material that unifies the design language across Apple platforms, allowing you to present controls and navigation without obscuring underlying content. In contrast to Liquid Glass, the
                - link "standard materials" [ref=f34e418] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#Standard-materials
                - text: help with visual differentiation within the content layer.
              - heading [level=2] [ref=f34e419]:
                - link "Liquid Glass in page link" [ref=f34e420] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#Liquid-Glass
              - paragraph [ref=f34e421]: Liquid Glass forms a distinct functional layer for controls and navigation elements — like tab bars and sidebars — that floats above the content layer, establishing a clear visual hierarchy between functional elements and content. Liquid Glass allows content to scroll and peek through from beneath these elements to give the interface a sense of dynamism and depth, all while maintaining legibility for controls and navigation.
              - paragraph [ref=f34e422]:
                - strong [ref=f34e423]: Don’t use Liquid Glass in the content layer.
                - text: Liquid Glass works best when it provides a clear distinction between interactive elements and content, and including it in the content layer can result in unnecessary complexity and a confusing visual hierarchy. Instead, use
                - link "standard materials" [ref=f34e424] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#Standard-materials
                - text: for elements in the content layer, such as app backgrounds. An exception to this is for controls in the content layer with a transient interactive element like
                - link "sliders" [ref=f34e425] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/sliders
                - text: and
                - link "toggles" [ref=f34e426] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/toggles
                - text: ; in these cases, the element takes on a Liquid Glass appearance to emphasize its interactivity when a person activates it.
              - paragraph [ref=f34e427]:
                - strong [ref=f34e428]: Use Liquid Glass effects sparingly.
                - text: Standard components from system frameworks pick up the appearance and behavior of this material automatically. If you apply Liquid Glass effects to a custom control, do so sparingly. Liquid Glass seeks to bring attention to the underlying content, and overusing this material in multiple custom controls can provide a subpar user experience by distracting from that content. Limit these effects to the most important functional elements in your app. For developer guidance, see
                - link "Applying Liquid Glass to custom views" [ref=f34e429] [cursor=pointer]:
                  - /url: /documentation/swiftui/applying-liquid-glass-to-custom-views
                - text: .
              - paragraph [ref=f34e430]:
                - strong [ref=f34e431]: Only use clear Liquid Glass for components that appear over visually rich backgrounds.
                - text: Liquid Glass provides two variants —
                - link [ref=f34e432] [cursor=pointer]:
                  - /url: /documentation/swiftui/glass/regular
                  - code [ref=f34e433]: regular
                - text: and
                - link [ref=f34e434] [cursor=pointer]:
                  - /url: /documentation/swiftui/glass/clear
                  - code [ref=f34e435]: clear
                - text: — that you can choose when building custom components or styling some system components. The appearance of these variants can differ in response to certain system settings, like if people choose a preferred look for Liquid Glass in their device’s settings, or turn on accessibility settings that reduce transparency or increase contrast in the interface.
              - paragraph [ref=f34e436]:
                - text: The
                - emphasis [ref=f34e437]: regular
                - text: variant blurs and adjusts the luminosity of background content to maintain legibility of text and other foreground elements. Scroll edge effects further enhance legibility by blurring and reducing the opacity of background content. Most system components use this variant. Use the regular variant when background content might create legibility issues, or when components have a significant amount of text, such as alerts, sidebars, or popovers.
              - generic [ref=f34e438]:
                - paragraph [ref=f34e440]:
                  - figure "On dark background" [ref=f34e441]:
                    - img "A visual example of the regular variant of Liquid Glass, which appears darker when there is a dark background beneath it." [ref=f34e443]
                - paragraph [ref=f34e446]:
                  - figure "On light background" [ref=f34e447]:
                    - img "A visual example of the regular variant of Liquid Glass, which appears lighter when there is a light background beneath it." [ref=f34e449]
              - paragraph [ref=f34e451]:
                - text: The
                - emphasis [ref=f34e452]: clear
                - text: variant is highly translucent, which is ideal for prioritizing the visibility of the underlying content and ensuring visually rich background elements remain prominent. Use this variant for components that float above media backgrounds — such as photos and videos — to create a more immersive content experience.
              - paragraph:
                - generic:
                  - img "A visual example of the clear variant of Liquid Glass, which allows the visual detail of the background beneath it to show through."
              - paragraph [ref=f34e453]: "For optimal contrast and legibility, determine whether to add a dimming layer behind components with clear Liquid Glass:"
              - list [ref=f34e454]:
                - listitem [ref=f34e455]:
                  - paragraph [ref=f34e456]:
                    - text: If the underlying content is bright, consider adding a dark dimming layer of 35% opacity. For developer guidance, see
                    - link [ref=f34e457] [cursor=pointer]:
                      - /url: /documentation/swiftui/glass/clear
                      - code [ref=f34e458]: clear
                    - text: .
                - listitem [ref=f34e459]:
                  - paragraph [ref=f34e460]: If the underlying content is sufficiently dark, or if you use standard media playback controls from AVKit that provide their own dimming layer, you don’t need to apply a dimming layer.
              - paragraph [ref=f34e461]:
                - text: For guidance about the use of color, see
                - link "Liquid Glass color" [ref=f34e462] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Liquid-Glass-color
                - text: .
              - heading [level=2] [ref=f34e463]:
                - link "Standard materials in page link" [ref=f34e464] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#Standard-materials
              - paragraph [ref=f34e465]:
                - text: Use standard materials and effects — such as
                - link "blur" [ref=f34e466] [cursor=pointer]:
                  - /url: /documentation/uikit/uiblureffect
                - text: ","
                - link "vibrancy" [ref=f34e467] [cursor=pointer]:
                  - /url: /documentation/uikit/uivibrancyeffect
                - text: ", and"
                - link "blending modes" [ref=f34e468] [cursor=pointer]:
                  - /url: /documentation/appkit/nsvisualeffectview/blendingmode-swift.enum
                - text: — to convey a sense of structure in the content beneath Liquid Glass.
              - paragraph [ref=f34e469]:
                - strong [ref=f34e470]: Choose materials and effects based on semantic meaning and recommended usage.
                - text: Avoid selecting a material or effect based on the apparent color it imparts to your interface, because system settings can change its appearance and behavior. Instead, match the material or vibrancy style to your specific use case.
              - paragraph [ref=f34e471]:
                - strong [ref=f34e472]: Help ensure legibility by using vibrant colors on top of materials.
                - text: When you use system-defined vibrant colors, you don’t need to worry about colors seeming too dark, bright, saturated, or low contrast in different contexts. Regardless of the material you choose, use vibrant colors on top of it. For guidance, see
                - link "System colors" [ref=f34e473] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#System-colors
                - text: .
              - generic [ref=f34e474]:
                - generic [ref=f34e475]:
                  - paragraph [ref=f34e476]:
                    - figure [ref=f34e477]:
                      - generic:
                        - img "An illustration of a Share button with a translucent background material and a symbol. The symbol uses the systemGray3 color and is difficult to see against the background material."
