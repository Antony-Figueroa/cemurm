              - heading [level=3] [ref=f34e686]:
                - link "watchOS in page link" [ref=f34e687] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#watchOS
              - paragraph [ref=f34e688]:
                - strong [ref=f34e689]: Use materials to provide context in a full-screen modal view.
                - text: Because full-screen modal views are common in watchOS, the contrast provided by material layers can help orient people in your app and distinguish controls and system elements from other content. Avoid removing or replacing material backgrounds for modal sheets when they’re provided by default.
