              - paragraph [ref=f34e484]:
                - strong [ref=f34e485]: Consider contrast and visual separation when choosing a material to combine with blur and vibrancy effects.
                - text: "For example, consider that:"
              - list [ref=f34e486]:
                - listitem [ref=f34e487]:
                  - paragraph [ref=f34e488]: Thicker materials, which are more opaque, can provide better contrast for text and other elements with fine features.
                - listitem [ref=f34e489]:
                  - paragraph [ref=f34e490]: Thinner materials, which are more translucent, can help people retain their context by providing a visible reminder of the content that’s in the background.
              - paragraph [ref=f34e491]:
                - text: For developer guidance, see
                - link [ref=f34e492] [cursor=pointer]:
                  - /url: /documentation/swiftui/material
                  - code [ref=f34e493]: Material
                - text: .
              - heading [level=2] [ref=f34e494]:
                - link "Platform considerations in page link" [ref=f34e495] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#Platform-considerations
              - heading [level=3] [ref=f34e496]:
                - link "iOS, iPadOS in page link" [ref=f34e497] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#iOS-iPadOS
              - paragraph [ref=f34e498]: In addition to Liquid Glass, iOS and iPadOS continue to provide four standard materials — ultra-thin, thin, regular (default), and thick — which you can use in the content layer to help create visual distinction.
              - generic [ref=f34e499]:
                - paragraph [ref=f34e501]:
                  - figure [ref=f34e502]:
                    - generic:
                      - img "An illustration of the iOS and iPadOS ultraThin material above a colorful background. Where the material overlaps the background, it provides a diffuse gradient of the background colors."
                    - code [ref=f34e504]: ultraThin
                - paragraph [ref=f34e506]:
                  - figure [ref=f34e507]:
                    - generic:
                      - img "An illustration of the iOS and iPadOS thin material above a colorful background. Where the material overlaps the background, it provides a diffuse and slightly darkened gradient of the background colors."
                    - code [ref=f34e509]: thin
              - generic [ref=f34e510]:
                - paragraph [ref=f34e512]:
                  - figure [ref=f34e513]:
                    - generic:
                      - img "An illustration of the iOS and iPadOS regular material above a colorful background. Where the material overlaps the background, it provides a diffuse and darkened gradient of the background colors."
                    - code [ref=f34e515]: regular
                - paragraph [ref=f34e517]:
                  - figure [ref=f34e518]:
                    - generic:
                      - img "An illustration of the iOS and iPadOS thick material above a colorful background. Where the material overlaps the background, it provides a dark, muted gradient of the background colors."
                    - code [ref=f34e520]: thick
              - paragraph [ref=f34e521]: "iOS and iPadOS also define vibrant colors for labels, fills, and separators that are specifically designed to work with each material. Labels and fills both have several levels of vibrancy; separators have one level. The name of a level indicates the relative amount of contrast between an element and the background: The default level has the highest contrast, whereas quaternary (when it exists) has the lowest contrast."
              - paragraph [ref=f34e522]:
                - text: Except for quaternary, you can use the following vibrancy values for labels on any material. In general, avoid using quaternary on top of the
                - link [ref=f34e523] [cursor=pointer]:
                  - /url: /documentation/swiftui/material/thin
                  - code [ref=f34e524]: thin
                - text: and
                - link [ref=f34e525] [cursor=pointer]:
