              - heading [level=3] [ref=f34e572]:
                - link "tvOS in page link" [ref=f34e573] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#tvOS
              - paragraph [ref=f34e574]: In tvOS, Liquid Glass appears throughout navigation elements and system experiences such as Top Shelf and Control Center. Certain interface elements, like image views and buttons, adopt Liquid Glass when they gain focus.
              - paragraph [ref=f34e575]:
                - img "A screenshot of the Destination Video app running in tvOS. The app shows a screen with details about a video called A BOT-anist Adventure. The background is a colorful image of the main character in a scene from the video. The interface elements floating above the background adopt a Liquid Glass appearance to allow background color to show through and create a more immersive media experience." [ref=f34e579]
              - paragraph [ref=f34e580]: "In addition to Liquid Glass, tvOS continues to provide standard materials, which you can use to help define structure in the content layer. The thickness of a standard material affects how prominently the underlying content shows through. For example, consider using standard materials in the following ways:"
              - table [ref=f34e582]:
                - rowgroup [ref=f34e583]:
                  - row [ref=f34e584]:
                    - columnheader [ref=f34e585]:
                      - paragraph [ref=f34e586]: Material
                    - columnheader [ref=f34e587]:
                      - paragraph [ref=f34e588]: Recommended for
                - rowgroup [ref=f34e589]:
                  - row [ref=f34e590]:
                    - cell [ref=f34e591]:
                      - paragraph [ref=f34e592]:
                        - link [ref=f34e593] [cursor=pointer]:
                          - /url: /documentation/swiftui/material/ultrathin
                          - code [ref=f34e594]: ultraThin
                    - cell [ref=f34e595]:
                      - paragraph [ref=f34e596]: Full-screen views that require a light color scheme
                  - row [ref=f34e597]:
                    - cell [ref=f34e598]:
                      - paragraph [ref=f34e599]:
                        - link [ref=f34e600] [cursor=pointer]:
                          - /url: /documentation/swiftui/material/thin
                          - code [ref=f34e601]: thin
                    - cell [ref=f34e602]:
                      - paragraph [ref=f34e603]: Overlay views that partially obscure onscreen content and require a light color scheme
                  - row [ref=f34e604]:
                    - cell [ref=f34e605]:
                      - paragraph [ref=f34e606]:
                        - link [ref=f34e607] [cursor=pointer]:
                          - /url: /documentation/swiftui/material/regular
                          - code [ref=f34e608]: regular
                    - cell [ref=f34e609]:
                      - paragraph [ref=f34e610]: Overlay views that partially obscure onscreen content
                  - row [ref=f34e611]:
                    - cell [ref=f34e612]:
                      - paragraph [ref=f34e613]:
                        - link [ref=f34e614] [cursor=pointer]:
                          - /url: /documentation/swiftui/material/thick
                          - code [ref=f34e615]: thick
                    - cell [ref=f34e616]:
                      - paragraph [ref=f34e617]: Overlay views that partially obscure onscreen content and require a dark color scheme
              - heading [level=3] [ref=f34e618]:
                - link "visionOS in page link" [ref=f34e619] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/materials#visionOS
              - paragraph [ref=f34e620]:
                - text: In visionOS, windows generally use an unmodifiable system-defined material called
                - emphasis [ref=f34e621]: glass
                - text: that helps people stay grounded by letting light, the current Environment, virtual content, and objects in people’s surroundings show through. Glass is an adaptive material that limits the range of background color information so a window can continue to provide contrast for app content while becoming brighter or darker depending on people’s physical surroundings and other virtual content.
              - 'group "Video with custom controls. Content description: A recording of the Music app window in visionOS. The window uses the glass material and adapts as the viewing angle and lighting change." [ref=f34e623]':
                - link "Play" [ref=f34e626] [cursor=pointer]:
                  - /url: "#"
              - complementary "note" [ref=f34e631]:
                - paragraph [ref=f34e632]: Note
                - paragraph [ref=f34e633]: visionOS doesn’t have a distinct Dark Mode setting. Instead, glass automatically adapts to the luminance of the objects and colors behind it.
              - paragraph [ref=f34e634]:
                - strong [ref=f34e635]: Prefer translucency to opaque colors in windows.
                - text: Areas of opacity can block people’s view, making them feel constricted and reducing their awareness of the virtual and physical objects around them.
              - generic [ref=f34e636]:
                - generic [ref=f34e637]:
                  - paragraph:
                    - generic:
                      - img "An illustration of a field of view in visionOS with a window in the center. The window has an opaque background that obstructs its surroundings."
                  - paragraph:
                    - generic:
                      - img "An X in a circle to indicate incorrect usage"
                - generic [ref=f34e638]:
                  - paragraph:
                    - generic:
                      - img "An illustration of a field of view in visionOS with a window in the center. The window has a translucent material background that allows its surroundings to pass through."
                  - paragraph:
                    - generic:
                      - img "A checkmark in a circle to indicate correct usage"
              - paragraph [ref=f34e639]:
                - strong [ref=f34e640]: If necessary, choose materials that help you create visual separations or indicate interactivity in your app.
                - text: If you need to create a custom component, you may need to specify a system material for it. Use the following examples for guidance.
              - list [ref=f34e641]:
                - listitem [ref=f34e642]:
                  - paragraph [ref=f34e643]:
                    - text: The
                    - link [ref=f34e644] [cursor=pointer]:
                      - /url: /documentation/swiftui/material/thin
                      - code [ref=f34e645]: thin
                    - text: material brings attention to interactive elements like buttons and selected items.
                - listitem [ref=f34e646]:
                  - paragraph [ref=f34e647]:
                    - text: The
                    - link [ref=f34e648] [cursor=pointer]:
                      - /url: /documentation/swiftui/material/regular
                      - code [ref=f34e649]: regular
                    - text: material can help you visually separate sections of your app, like a sidebar or a grouped table view.
                - listitem [ref=f34e650]:
                  - paragraph [ref=f34e651]:
                    - text: The
                    - link [ref=f34e652] [cursor=pointer]:
                      - /url: /documentation/swiftui/material/thick
                      - code [ref=f34e653]: thick
                    - text: material lets you create a dark element that remains visually distinct when it’s on top of an area that uses a
                    - code [ref=f34e654]: regular
                    - text: background.
              - paragraph:
                - generic:
                  - img "An illustration of a field of view in visionOS with a window in the center. The window is composed of a sidebar on the left and a content area on the right, with a text field at the top and a button in the lower-right corner. The sidebar uses regular material, while the text field uses thick material and the button uses thin material."
              - paragraph [ref=f34e655]: To ensure foreground content remains legible when it displays on top of a material, visionOS applies vibrancy to text, symbols, and fills. Vibrancy enhances the sense of depth by pulling light and color forward from both virtual and physical surroundings.
              - paragraph [ref=f34e656]: visionOS defines three vibrancy values that help you communicate a hierarchy of text, symbols, and fills.
              - list [ref=f34e657]:
                - listitem [ref=f34e658]:
                  - paragraph [ref=f34e659]:
                    - text: Use
                    - link [ref=f34e660] [cursor=pointer]:
                      - /url: /documentation/uikit/uivibrancyeffectstyle/label
                      - code [ref=f34e661]: UIVibrancyEffectStyle.label
                    - text: for standard text.
                - listitem [ref=f34e662]:
                  - paragraph [ref=f34e663]:
                    - text: Use
                    - link [ref=f34e664] [cursor=pointer]:
                      - /url: /documentation/uikit/uivibrancyeffectstyle/secondarylabel
                      - code [ref=f34e665]: UIVibrancyEffectStyle.secondaryLabel
                    - text: for descriptive text like footnotes and subtitles.
                - listitem [ref=f34e666]:
                  - paragraph [ref=f34e667]:
                    - text: Use
                    - link [ref=f34e668] [cursor=pointer]:
                      - /url: /documentation/uikit/uivibrancyeffectstyle/tertiarylabel
                      - code [ref=f34e669]: UIVibrancyEffectStyle.tertiaryLabel
                    - text: for inactive elements, and only when text doesn’t need high legibility.
