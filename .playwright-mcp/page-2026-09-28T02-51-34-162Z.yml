        - generic [ref=f46e122]:
          - main [ref=f46e123]:
            - generic [ref=f46e126]:
              - heading "Dark Mode" [level=1] [ref=f46e128]
              - generic [ref=f46e129]: Dark Mode is a systemwide appearance setting that uses a dark color palette to provide a comfortable viewing experience tailored for low-light environments.
            - generic [ref=f46e134]:
              - paragraph:
                - generic:
                  - img "A sketch of concentric circles with half-filled areas, suggesting the presence of light and dark. The image is overlaid with rectangular and circular grid lines and is tinted yellow to subtly reflect the yellow in the original six-color Apple logo."
              - paragraph [ref=f46e135]: In iOS, iPadOS, macOS, and tvOS, people often choose Dark Mode as their default interface style, and they generally expect all apps and games to respect their preference. In Dark Mode, the system uses a dark color palette for all screens, views, menus, and controls, and may also use greater perceptual contrast to make foreground content stand out against the darker backgrounds.
              - heading [level=2] [ref=f46e136]:
                - link "Best practices in page link" [ref=f46e137] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode#Best-practices
              - paragraph [ref=f46e138]:
                - strong [ref=f46e139]: Avoid offering an app-specific appearance setting.
                - text: An app-specific appearance mode option creates more work for people because they have to adjust more than one setting to get the appearance they want. Worse, they may think your app is broken because it doesn’t respond to their systemwide appearance choice.
              - paragraph [ref=f46e140]:
                - strong [ref=f46e141]: Ensure that your app looks good in both appearance modes.
                - text: In addition to using one mode or the other, people can choose the Auto appearance setting, which switches between the light and dark appearances as conditions change throughout the day, potentially while your app is running.
              - paragraph [ref=f46e142]:
                - strong [ref=f46e143]: Test your content to make sure that it remains comfortably legible in both appearance modes.
                - text: For example, in Dark Mode with Increase Contrast and Reduce Transparency turned on (both separately and together), you may find places where dark text is less legible when it’s on a dark background. You might also find that turning on Increase Contrast in Dark Mode can result in reduced visual contrast between dark text and a dark background. Although people with strong vision might still be able to read lower contrast text, such text could be illegible for many. For guidance, see
                - link "Accessibility" [ref=f46e144] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/accessibility
                - text: .
              - paragraph [ref=f46e145]:
                - strong [ref=f46e146]: In rare cases, consider using only a dark appearance in the interface.
                - text: For example, it can make sense for an app that supports immersive media viewing to use a permanently dark appearance that lets the UI recede and helps people focus on the media.
              - paragraph [ref=f46e147]:
                - figure "The Stocks app uses a dark-only appearance" [ref=f46e148]:
                  - img "A screenshot of the Stocks app on iPhone in its standard dark-only appearance, showing the Apple Inc. stock in detail. The view includes a summary of the current stock price along with a graph of its performance over the past year." [ref=f46e152]
              - heading [level=2] [ref=f46e154]:
                - link "Dark Mode colors in page link" [ref=f46e155] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode#Dark-Mode-colors
              - paragraph [ref=f46e156]:
                - text: "The color palette in Dark Mode includes dimmer background colors and brighter foreground colors. It’s important to realize that these colors aren’t necessarily inversions of their light counterparts: while many colors are inverted, some are not. For more information, see"
                - link "Specifications" [ref=f46e157] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color#Specifications
                - text: .
              - paragraph [ref=f46e158]:
                - strong [ref=f46e159]: Embrace colors that adapt to the current appearance.
                - text: Semantic colors (like
                - link [ref=f46e160] [cursor=pointer]:
                  - /url: /documentation/appkit/nscolor/labelcolor
                  - code [ref=f46e161]: labelColor
                - text: and
                - link [ref=f46e162] [cursor=pointer]:
                  - /url: /documentation/appkit/nscolor/controlcolor
                  - code [ref=f46e163]: controlColor
                - text: in macOS or
                - link [ref=f46e164] [cursor=pointer]:
                  - /url: /documentation/uikit/uicolor/separator
                  - code [ref=f46e165]: separator
                - text: in iOS and iPadOS) automatically adapt to the current appearance. When you need a custom color, add a Color Set asset to your app’s asset catalog in Xcode, and specify the bright and dim variants of the color. Avoid using hard-coded color values or colors that don’t adapt.
              - generic [ref=f46e166]:
                - paragraph [ref=f46e168]:
                  - figure "System colors in the light appearance" [ref=f46e169]:
                    - generic:
                      - img "An illustration of a square with a light background and four color swatches representing system colors in the light appearance."
                - paragraph [ref=f46e172]:
                  - figure "System colors in the dark appearance" [ref=f46e173]:
                    - generic:
                      - img "An illustration of a square with a dark background and four color swatches representing system colors in the dark appearance."
              - paragraph [ref=f46e175]:
                - strong [ref=f46e176]: Aim for sufficient color contrast in all appearances.
                - text: Using system-defined colors can help you achieve a good contrast ratio between your foreground and background content. At a minimum, make sure the contrast ratio between colors is no lower than 4.5:1. For custom foreground and background colors, strive for a contrast ratio of 7:1, especially in small text. This ratio ensures that your foreground content stands out from the background, and helps your content meet recommended accessibility guidelines.
              - paragraph [ref=f46e177]:
                - strong [ref=f46e178]: Soften the color of white backgrounds.
                - text: If you display a content image that includes a white background, consider slightly darkening the image to prevent the background from glowing in the surrounding Dark Mode context.
              - heading [level=3] [ref=f46e179]:
                - link "Icons and images in page link" [ref=f46e180] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode#Icons-and-images
              - paragraph [ref=f46e181]:
                - text: The system uses
                - link "SF Symbols" [ref=f46e182] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/sf-symbols
                - text: (which automatically adapt to Dark Mode) and full-color images that are optimized for both the light and dark appearances.
              - paragraph [ref=f46e183]:
                - strong [ref=f46e184]: Use SF Symbols wherever possible.
                - text: Symbols work well in both appearance modes when you use dynamic colors to tint them or when you add vibrancy. For guidance, see
                - link "Color" [ref=f46e185] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/color
                - text: .
              - paragraph [ref=f46e186]:
                - strong [ref=f46e187]: Design separate interface icons for the light and dark appearances if necessary.
                - text: For example, an icon that depicts a full moon might need a subtle dark outline to contrast well with a light background, but need no outline when it displays on a dark background. Similarly, an icon that represents a drop of oil might need a slight border to make the edge visible against a dark background.
              - generic [ref=f46e188]:
                - paragraph [ref=f46e190]:
                  - figure "Icon in the light appearance with no border" [ref=f46e191]:
                    - generic:
                      - img "An illustration of a black droplet icon against a light background."
                - paragraph [ref=f46e194]:
                  - figure "Icon in the dark appearance with border for better contrast" [ref=f46e195]:
                    - generic:
                      - img "An illustration of a black droplet icon against a dark background. The icon has a white border to distinguish it from the similar surrounding color."
              - paragraph [ref=f46e197]:
                - strong [ref=f46e198]: Make sure full-color images and icons look good in both appearances.
                - text: Use the same asset if it looks good in both the light and dark appearances. If an asset looks good in only one mode, modify the asset or create separate light and dark assets. Use asset catalogs to combine your assets into a single named image.
              - generic [ref=f46e199]:
                - paragraph [ref=f46e201]:
                  - figure "Illustration on a light background" [ref=f46e202]:
                    - generic:
                      - img "An illustration of two people sitting at a restaurant table done in a simple, abstract style. The illustration has a light background and its details are clearly visible."
                - paragraph [ref=f46e205]:
                  - figure "On a dark background, the same illustration has poor contrast and many details are lost" [ref=f46e206]:
                    - generic:
                      - img "An illustration of two people sitting at a restaurant table done in a simple, abstract style. The illustration has a dark background, and the darker portions of the image are hard to distinguish from the background."
                - paragraph [ref=f46e209]:
                  - figure "Illustration adjusted for better contrast on a dark background" [ref=f46e210]:
                    - generic:
                      - img "An illustration of two people sitting at a restaurant table done in a simple, abstract style. The illustration has a dark background, and its color values are adjusted to be clearly visible in contrast to the background."
              - heading [level=3] [ref=f46e212]:
                - link "Text in page link" [ref=f46e213] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode#Text
              - paragraph [ref=f46e214]: The system uses vibrancy and increased contrast to maintain the legibility of text on darker backgrounds.
              - paragraph [ref=f46e215]:
                - strong [ref=f46e216]: Use the system-provided label colors for labels.
                - text: The primary, secondary, tertiary, and quaternary label colors adapt automatically to the light and dark appearances.
              - generic [ref=f46e217]:
                - paragraph [ref=f46e219]:
                  - figure "Primary label in the light appearance" [ref=f46e220]:
                    - generic:
                      - img "An illustration of a button in the light appearance with dark primary label text."
                - paragraph [ref=f46e223]:
                  - figure "Secondary label in the dark appearance" [ref=f46e224]:
                    - generic:
                      - img "An illustration of a button in the dark appearance with light secondary label text."
              - paragraph [ref=f46e226]:
                - strong [ref=f46e227]: Use system views to draw text fields and text views.
                - text: System views and controls make your app’s text look good on all backgrounds, adjusting automatically for the presence or absence of vibrancy. When possible, use a system-provided view to display text instead of drawing the text yourself.
              - heading [level=2] [ref=f46e228]:
                - link "Platform considerations in page link" [ref=f46e229] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode#Platform-considerations
              - paragraph [ref=f46e230]:
                - emphasis [ref=f46e231]: No additional considerations for tvOS. Dark Mode isn’t supported in visionOS or watchOS.
              - heading [level=3] [ref=f46e232]:
                - link "iOS, iPadOS in page link" [ref=f46e233] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode#iOS-iPadOS
              - paragraph [ref=f46e234]:
                - text: In Dark Mode, the system uses two sets of background colors — called
                - emphasis [ref=f46e235]: base
                - text: and
                - emphasis [ref=f46e236]: elevated
                - text: — to enhance the perception of depth when one dark interface is layered above another. The base colors are dimmer, making background interfaces appear to recede, and the elevated colors are brighter, making foreground interfaces appear to advance.
              - generic [ref=f46e237]:
                - paragraph [ref=f46e239]:
                  - figure "Base" [ref=f46e240]:
                    - generic:
                      - img "A diagram that shows a stack of 4 terms on top of a black background. The term at the top shows the most contrast with the background and the term at the bottom shows the least."
                - paragraph [ref=f46e243]:
                  - figure "Elevated" [ref=f46e244]:
                    - generic:
                      - img "A diagram that shows a stack of 4 terms on top of a nearly black background. The term at the top shows the most contrast with the background and the term at the bottom shows the least."
                - paragraph [ref=f46e247]:
                  - figure "Light" [ref=f46e248]:
                    - generic:
                      - img "A diagram that shows a stack of 4 terms on top of a white background. The term at the top shows the most contrast with the background and the term at the bottom shows the least."
              - paragraph [ref=f46e250]:
                - strong [ref=f46e251]: Prefer the system background colors.
                - text: Dark Mode is dynamic, which means that the background color automatically changes from base to elevated when an interface is in the foreground, such as a popover or modal sheet. The system also uses the elevated background color to provide visual separation between apps in a multitasking environment and between windows in a multiple-window context. Using a custom background color can make it harder for people to perceive these system-provided visual distinctions.
              - heading [level=3] [ref=f46e252]:
                - link "macOS in page link" [ref=f46e253] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode#macOS
              - paragraph [ref=f46e254]:
                - text: When people choose the graphite accent color in General settings, macOS causes window backgrounds to pick up color from the current desktop picture. The result — called
                - emphasis [ref=f46e255]: desktop tinting
                - text: — is a subtle effect that helps windows blend more harmoniously with their surrounding content.
              - paragraph [ref=f46e256]:
                - strong [ref=f46e257]: Include some transparency in custom component backgrounds when appropriate.
                - text: Transparency lets your components pick up color from the window background when desktop tinting is active, creating a visual harmony that can persist even when the desktop picture changes. To help achieve this harmony, add transparency only to a custom component that has a visible background or bezel, and only when the component is in a neutral state, such as state that doesn’t use color. You don’t want to add transparency when the component is in a state that uses color, because doing so can cause the component’s color to fluctuate when the window background adjusts to a different location on the desktop or when the desktop picture changes.
              - heading [level=2] [ref=f46e258]:
                - link "Resources in page link" [ref=f46e259] [cursor=pointer]:
                  - /url: /design/human-interface-guidelines/dark-mode#Resources
